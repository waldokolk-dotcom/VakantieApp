<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="app-version" content="122">
  <title>Vakantie 2026</title>
  <meta name="theme-color" content="#155c38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VakantieApp B&amp;W">
  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=122">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=122">
<!-- v52 mobile navigation -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --bg:#f7f0dc;
      --bg2:#eef2df;
      --card:#fffdf8;
      --ink:#173e31;
      --muted:#6e7e75;
      --green:#165f43;
      --green2:#2c7a5c;
      --line:#e5dcc7;
      --soft:#edf3ea;
      --danger:#a44444;
      --shadow:0 10px 30px rgba(34,55,44,.08);
      --radius:24px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top right, rgba(210,226,194,.55), transparent 34%),
        linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
      min-height:100vh;
    }
    button,input,select,textarea{font:inherit}
    .shell{max-width:1180px;margin:0 auto;padding:22px}
    .top{
      display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
      padding:24px 0 12px;
    }
    .eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green2)}
    h1{font-size:clamp(2.2rem,6vw,5rem);line-height:.95;margin:8px 0 8px;font-weight:800;letter-spacing:-.05em}
    .subtitle{max-width:640px;color:var(--muted);font-size:1.05rem}
    .status-pill{
      background:rgba(255,255,255,.75);backdrop-filter:blur(10px);
      border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:700;white-space:nowrap;
    }
    .status-pill.ok{color:var(--green)}
    .status-pill.bad{color:var(--danger)}
    .nav{
      position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow:auto;padding:12px 0 18px;
      background:linear-gradient(180deg,rgba(247,240,220,.97),rgba(247,240,220,.82),transparent);
    }
    .nav button{
      border:1px solid var(--line);background:rgba(255,255,255,.74);color:var(--ink);
      border-radius:999px;padding:11px 14px;cursor:pointer;white-space:nowrap;font-weight:750;
    }
    .nav button.active{background:var(--green);color:white;border-color:var(--green)}
    .view{display:none}
    .view.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
    .card{
      grid-column:span 12;background:rgba(255,253,248,.92);border:1px solid var(--line);
      border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
    }
    .card h2{margin:0 0 8px;font-size:1.5rem}
    .muted{color:var(--muted)}
    .hero-card{
      min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;
      background:
        linear-gradient(180deg,transparent 10%,rgba(18,67,48,.78) 100%),
        linear-gradient(135deg,#9bb699,#d9d8b7);
      color:white;border:none;
    }
    .hero-card .muted{color:rgba(255,255,255,.83)}
    .hero-title{font-size:clamp(2rem,5vw,4rem);line-height:1;margin:4px 0 10px;letter-spacing:-.04em}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .kpi{background:var(--soft);padding:16px;border-radius:18px}
    .kpi b{display:block;font-size:1.5rem;margin-top:4px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
    .toolbar input,.toolbar select,.form-grid input,.form-grid select,.form-grid textarea{
      border:1px solid #d7d0be;border-radius:14px;padding:12px 13px;background:white;color:var(--ink);
    }
    .toolbar input{flex:1;min-width:190px}
    .packing-search-wrap{display:flex;flex:1 1 320px;gap:8px;min-width:260px}
    .packing-search-wrap input{min-width:0;width:100%}
    .packing-mode-launch{background:#d7a94b;color:#183f31}
    .packing-mode[hidden]{display:none}
    .packing-mode{position:fixed;inset:0;z-index:2500;background:#fffdf7;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow:auto}
    .packing-mode-inner{width:min(620px,100%);min-height:100%;margin:auto;display:flex;flex-direction:column;gap:16px}
    .packing-mode-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .packing-mode-progress{font-weight:800;color:var(--green)}
    .packing-mode-card{flex:1;min-height:310px;background:white;border-radius:28px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 18px 50px rgba(18,67,48,.16)}
    .packing-mode-icon{font-size:4rem;line-height:1}
    .packing-mode-card h3{font-size:clamp(1.8rem,7vw,3rem);margin:18px 0 8px}
    .packing-mode-meta{font-size:1.05rem;color:#47685c}
    .packing-mode-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .packing-mode-actions .btn{min-height:62px;font-size:1.05rem}
    .packing-mode-actions .packing-mode-packed{grid-column:1/-1;background:var(--green);font-size:1.2rem}
    .packing-voice{background:white;border-radius:20px;padding:14px;text-align:center}
    .packing-quick-input{width:100%;min-height:58px;border:2px solid #b9cdbf;border-radius:15px;padding:12px 14px;font-size:1rem;margin-bottom:10px}
    .packing-voice-result{min-height:1.5em;margin-top:8px;font-weight:750;line-height:1.4}
    .packing-voice-choices{display:grid;gap:8px;margin-top:10px}
    .packing-voice-choices .btn{width:100%}
    .packing-voice .btn:disabled{opacity:.48;cursor:not-allowed}
    .packing-phone-voice-steps{margin:0 0 12px;padding:13px 14px;border-radius:15px;background:#edf5ee;border:1px solid #c7d9ca;text-align:left}
    .packing-phone-voice-steps strong{display:block;margin-bottom:7px;color:var(--green)}
    .packing-phone-voice-steps ol{margin:0 0 7px;padding-left:22px;font-weight:750;line-height:1.55}
    .packing-phone-voice-steps small{display:block;color:var(--muted);line-height:1.35}
    .packing-one-voice{width:100%;min-height:76px;border-radius:22px;font-size:1.22rem;background:var(--green);box-shadow:0 9px 24px rgba(22,95,67,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .packing-one-voice.recording{background:#b63838;animation:packingPulse 1.1s ease-in-out infinite}
    .packing-one-voice.processing{background:#786a43}
    .packing-manual-fallback{margin-top:10px}
    .packing-manual-fallback summary{cursor:pointer;color:var(--muted);font-weight:750}
    @keyframes packingPulse{50%{transform:scale(.985);box-shadow:0 0 0 8px rgba(182,56,56,.13)}}
    .packed-badge{display:inline-flex;margin-left:8px;padding:3px 8px;border-radius:999px;background:#176d4b;color:#fff;font-size:.75rem;font-weight:900;text-decoration:none;vertical-align:middle}
    .btn{
      border:0;border-radius:14px;padding:12px 16px;background:var(--green);color:white;font-weight:800;cursor:pointer;
    }
    .btn.secondary{background:#edf0e8;color:var(--ink)}
    .btn.danger{background:#f6eaea;color:var(--danger)}
    .list{display:flex;flex-direction:column}
    .row{
      display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid #ece5d7;
    }
    .row:last-child{border-bottom:0}
    .row-title{font-weight:800}
    .row-meta{color:var(--muted);font-size:.9rem;margin-top:3px}
    .status-btn{
      width:44px;height:44px;border-radius:50%;border:2px solid #b9c6bd;background:white;cursor:pointer;font-weight:900;color:white;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    }
    .status-btn.ready{background:#8aa98d;border-color:#8aa98d}
    .status-btn.packed{background:var(--green);border-color:var(--green)}
    .amount{font-weight:850;white-space:nowrap}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .form-grid label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:700}
    .form-grid .full{grid-column:1/-1}
    .connection{
      display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:14px;
    }
    .connection input{border:1px solid #d7d0be;border-radius:14px;padding:12px}
    .empty{padding:28px;text-align:center;color:var(--muted)}
    .section-intro{font-size:1.05rem;color:var(--muted);margin-top:0}
    .mini-map{
      height:240px;border-radius:20px;background:
        radial-gradient(circle at 25% 35%,rgba(34,102,73,.35) 0 8px,transparent 9px),
        radial-gradient(circle at 58% 55%,rgba(34,102,73,.45) 0 8px,transparent 9px),
        radial-gradient(circle at 78% 70%,rgba(34,102,73,.55) 0 8px,transparent 9px),
        linear-gradient(145deg,#e7ead9,#cfdcc6);
      position:relative;overflow:hidden;
    }
    .mini-map:after{content:"Nijkerk  →  Zwarte Woud  →  Zuid-Tirol  →  Allgäu";position:absolute;left:18px;bottom:18px;background:rgba(255,255,255,.9);padding:10px 14px;border-radius:999px;font-weight:800}
    .notice{background:#fff9e9;border:1px solid #ead8aa;padding:14px;border-radius:16px;margin-top:12px;color:#665531}

    .packing-groups{display:flex;flex-direction:column;gap:18px}
    .pack-group-title{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      font-size:1.18rem;font-weight:850;margin:4px 4px 8px;
    }
    .pack-count{
      min-width:42px;text-align:center;background:#edf5e8;color:var(--green);
      padding:7px 10px;border-radius:999px;font-size:.82rem;font-weight:900;
    }
    .pack-item{
      display:grid;grid-template-columns:42px minmax(180px,1fr) 126px 110px 82px;
      align-items:center;gap:12px;background:#fff;border:1px solid #e7dfcf;
      border-radius:18px;padding:12px;margin-bottom:8px;
    }
    .pack-item.packed{background:#f0f8ee;border-color:#cee2ca}
    .pack-item.packed .pack-name{text-decoration:line-through;color:#65766f}
    .pack-main{min-width:0}
    .pack-name{font-size:1.02rem;font-weight:850;line-height:1.15}
    .auto-pack-badge{
      display:inline-flex;align-items:center;margin-left:7px;padding:3px 7px;border-radius:999px;
      background:#e7f3e5;color:#226947;border:1px solid #bed8bc;
      font-size:.62rem;font-weight:900;line-height:1.15;vertical-align:middle;text-decoration:none;
    }
    .pack-extra{grid-column:1/-1;border-top:1px solid #ebe4d6;padding-top:8px}
    .pack-extra summary{cursor:pointer;color:#2d6f50;font-size:.78rem;font-weight:900;list-style:none}
    .pack-extra summary::-webkit-details-marker{display:none}
    .pack-extra summary::before{content:"＋";display:inline-block;margin-right:6px}
    .pack-extra[open] summary::before{content:"−"}
    .pack-extra summary span{float:right;color:#60776b;font-weight:750}
    .pack-extra-body{padding-top:10px;display:grid;gap:9px}
    .pack-note-label,.pack-calc-grid label{font-size:.72rem;font-weight:850;color:#4d6358}
    .pack-note-label textarea{width:100%;min-height:64px;resize:vertical;margin-top:5px;padding:9px;border:1px solid #ddd5c5;border-radius:10px}
    .pack-calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .pack-calc-grid input,.pack-calc-grid select{width:100%;margin-top:5px;padding:8px;border:1px solid #ddd5c5;border-radius:9px;background:#fff;color:var(--ink)}
    .pack-subitems{display:grid;gap:9px}
    .pack-subitem{padding:10px;border:1px solid #ded6c7;border-radius:12px;background:#faf9f4}
    .pack-subitem-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
    .pack-subitem-head strong{font-size:.8rem;color:#245b45}
    .pack-subitem-remove{border:0;background:#f5e6e2;color:#914d3e;border-radius:9px;padding:6px 9px;font-weight:850;cursor:pointer}
    .pack-add-subitem{justify-self:start;border:0;border-radius:10px;padding:9px 12px;background:#e7f2e5;color:#1d6745;font-weight:900;cursor:pointer}
    .pack-calc-result{padding:9px 11px;border-radius:10px;background:#eaf5e7;color:#1d6745;font-size:.82rem;font-weight:900}
    .pack-meta{font-size:.78rem;color:var(--muted);margin-top:5px}
    .pack-item-total{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:999px;background:#eaf5e7;color:#1d6745;font-size:.78rem;font-weight:900}
    .pack-updated{font-size:.7rem;color:#53806a;margin-top:4px;font-weight:700}
    .pack-due{
      background:#faf8f0;border:1px solid #e7dfcf;border-radius:12px;padding:7px 9px;
    }
    .pack-due small{
      display:block;text-transform:uppercase;letter-spacing:.08em;font-weight:900;
      font-size:.58rem;color:#718076;margin-bottom:4px
    }
    .pack-due input{
      width:100%;border:0;background:transparent;color:var(--green);font-weight:850;
      padding:0;outline:none;font-size:.78rem
    }
    .seg{
      display:grid;grid-template-columns:repeat(3,1fr);background:#f1eee5;
      border-radius:12px;padding:3px;gap:2px
    }
    .seg button{
      border:0;background:transparent;color:#8a968f;height:36px;border-radius:9px;
      font-weight:900;font-size:1.05rem;cursor:pointer;margin:0;padding:0
    }
    .seg button.active{background:var(--green);color:#fff}
    .pack-actions{display:flex;gap:6px}
    .icon-btn{
      border:0;background:#f1eee5;color:#5b7166;border-radius:10px;
      width:36px;height:36px;padding:0;margin:0;cursor:pointer;font-size:.95rem
    }
    .pack-add{
      border:1px dashed #c9c0aa;background:rgba(255,255,255,.55);
      border-radius:18px;padding:14px;margin-bottom:16px
    }
    .pack-add-grid{
      display:grid;grid-template-columns:2fr 1fr 1fr 90px 130px auto;gap:8px;align-items:end
    }
    .pack-add-grid label{display:flex;flex-direction:column;gap:5px;font-size:.72rem;font-weight:800;color:var(--muted)}
    .pack-add-grid input,.pack-add-grid select{
      width:100%;border:1px solid #d7d0be;border-radius:12px;padding:10px;background:white;color:var(--ink)
    }
    @media(max-width:900px){
      .pack-item{grid-template-columns:42px 1fr}
      .pack-due,.seg,.pack-actions{grid-column:2}
      .pack-due{width:150px}
      .seg{width:120px}
      .pack-actions{justify-content:flex-start}
      .pack-add-grid{grid-template-columns:1fr 1fr}
      .pack-add-grid .wide{grid-column:1/-1}
    }


    .pack-group-title{
      cursor:pointer;
      user-select:none;
    }
    .pack-group-head{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .pack-chevron{
      display:inline-flex;
      width:28px;
      height:28px;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      background:#f1eee5;
      color:var(--green);
      font-weight:900;
      transition:transform .18s ease;
      flex:0 0 auto;
    }
    .pack-group.collapsed .pack-chevron{transform:rotate(-90deg)}
    .pack-group-body{display:block}
    .pack-group.collapsed .pack-group-body{display:none}

    @media(min-width:760px){
      .span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
    }
    @media(max-width:760px){
      .shell{padding:14px}.top{flex-direction:column}.connection{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
      .kpis{grid-template-columns:1fr}.row{grid-template-columns:auto 1fr}.amount{grid-column:2}.nav{padding-top:8px}
    }
  
    /* ===== Oude Vakantie 2026-layout teruggezet ===== */
    body{
      background:
        linear-gradient(115deg,#fff4d1 0%,#fffaf0 42%,#eefbff 100%);
      color:#0f3b2f;
    }
    .shell{
      max-width:1480px;
      margin:0 auto;
      padding:0 10px 28px;
    }
    .legacy-header{
      min-height:96px;
      display:grid;
      grid-template-columns:280px 1fr 150px;
      align-items:start;
      gap:18px;
      padding:6px 0 0;
    }
    .legacy-brand{
      display:flex;
      align-items:flex-start;
      gap:18px;
      font-weight:900;
      color:#0d3a30;
    }
    .legacy-sun{
      width:48px;
      height:48px;
      margin-top:12px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f8b735;
      color:white;
      font-size:28px;
      box-shadow:0 4px 0 #d9a027;
    }
    .legacy-brand-text{
      font-size:32px;
      line-height:1.45;
      letter-spacing:-.04em;
    }
    .legacy-nav{
      position:static;
      padding:27px 0 0;
      background:none;
      justify-content:center;
      overflow:visible;
      gap:24px;
    }
    .legacy-nav button{
      border:0;
      background:transparent;
      border-radius:0;
      padding:7px 2px 18px;
      font-size:16px;
      color:#173d31;
      font-weight:850;
      position:relative;
    }
    .legacy-nav button.active{
      background:transparent;
      color:#173d31;
    }
    .legacy-nav button.active:after{
      content:"";
      position:absolute;
      left:4px;
      right:4px;
      bottom:0;
      height:3px;
      border-radius:999px;
      background:#74b56a;
    }
    .legacy-user{
      justify-self:end;
      margin-top:16px;
      min-width:120px;
      border:1px solid #e4d8bd;
      background:rgba(255,255,255,.72);
      color:#173d31;
      border-radius:18px;
      padding:16px 20px;
      font-weight:850;
      cursor:pointer;
    }
    .legacy-journey{padding:25px 0 0}
    .legacy-kicker{
      color:#4b8d47;
      font-size:13px;
      font-weight:900;
      letter-spacing:.13em;
      margin-bottom:8px;
    }
    .legacy-page-title{
      margin:0 0 30px;
      font-size:68px;
      line-height:1;
      font-weight:500;
      letter-spacing:-.045em;
      color:#173d31;
    }
    .legacy-route{
      display:flex;
      align-items:flex-start;
      width:min(640px,100%);
      margin-left:42px;
      gap:0;
    }
    .legacy-stop{
      width:86px;
      flex:0 0 86px;
      text-align:center;
    }
    .legacy-stop-icon{
      width:50px;
      height:50px;
      border-radius:50%;
      margin:0 auto 9px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4fbf4;
      border:1px solid #cfe4d2;
      font-size:22px;
      box-shadow:0 1px 3px rgba(0,0,0,.04);
    }
    .legacy-stop-icon.warm{
      background:#fff8e7;
      border-color:#efbd52;
    }
    .legacy-stop-name{
      font-size:13px;
      line-height:1.1;
      font-weight:850;
      color:#0f583c;
      white-space:nowrap;
    }
    .legacy-stop-sub{
      margin-top:5px;
      font-size:10px;
      color:#6c746e;
      white-space:nowrap;
    }
    .legacy-line{
      height:3px;
      flex:1 1 60px;
      margin-top:24px;
      background:linear-gradient(90deg,#72ad63,#dfae44);
      border-radius:999px;
      min-width:55px;
    }
    .legacy-intro-row{
      display:grid;
      grid-template-columns:1fr 190px;
      gap:28px;
      align-items:end;
      margin-top:25px;
    }
    .legacy-intro{
      font-size:20px;
      color:#718079;
      margin:0 0 22px;
    }
    .legacy-manage{
      border-radius:14px;
      padding:14px 20px;
      font-size:16px;
    }
    .legacy-range{
      background:rgba(255,255,255,.77);
      border:1px solid #eadbc0;
      border-radius:18px;
      padding:16px;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:end;
      min-height:92px;
    }
    .legacy-range span{
      grid-column:1/-1;
      color:#737a6d;
      font-size:12px;
      font-weight:850;
      letter-spacing:.04em;
    }
    .legacy-range strong{
      font-size:30px;
      line-height:1;
      color:#145536;
    }
    .legacy-range b{
      font-size:16px;

    }
    .pack-group .pack-item{

      border-top-color:var(--cat-border);
      border-right-color:var(--cat-border);
      border-bottom-color:var(--cat-border);
    }
    .pack-group .pack-item.packed{

      border-color:var(--cat-border);
      border-left-color:var(--cat-accent);
    }
    .pack-group .pack-updated{
      color:color-mix(in srgb,var(--cat-accent) 78%,#40564d);
    }
    .pack-group .pack-due{
      border-color:var(--cat-border);
      background:color-mix(in srgb,var(--cat-tint) 65%,white);
    }
    .pack-group .pack-due input{

    }

      color:white;
    }

      background:var(--cat-tint);
      color:var(--cat-accent);
    }

    /* ===== v17: regionale klokiconen bij aftelklokken ===== */
    .legacy-regional-clock{
      width:56px;
      height:56px;
      flex:0 0 56px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.22);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);
      position:relative;
    }
    .legacy-regional-clock svg{
      width:48px;
      height:48px;
      overflow:visible;
      display:block;
    }
    .legacy-regional-clock .clock-tooltip{
      position:absolute;
      right:0;
      top:62px;
      opacity:0;
      pointer-events:none;
      white-space:nowrap;
      background:#fffdf6;
      color:#173d31;
      border:1px solid #e3d8c1;
      border-radius:10px;
      padding:7px 9px;
      font-size:10px;
      font-weight:850;
      transform:translateY(-3px);
      transition:.15s ease;
      z-index:20;
    }
    .legacy-regional-clock:hover .clock-tooltip{
      opacity:1;
      transform:translateY(0);
    }

    .legacy-regional-clock svg .clock-pendulum{
      animation:swingPendulum 1.8s ease-in-out infinite;
      transform-box:fill-box;
    }
    .legacy-regional-clock svg .hour-hand,
    .legacy-regional-clock svg .minute-hand,
    .legacy-regional-clock svg .second-hand{
      transition:transform .25s linear;
      transform-box:fill-box;
    }
    @keyframes swingPendulum{
      0%,100%{transform:rotate(16deg)}
      50%{transform:rotate(-16deg)}
    }

  
    /* ===== v21: categorie-icoon is de uitklapknop ===== */
    .pack-chevron{display:none !important}
    .pack-cat-toggle{
      border:0;

      margin:0;
      cursor:pointer;
      font:inherit;
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;

      box-shadow:0 5px 14px color-mix(in srgb,var(--cat-accent) 28%,transparent);

    .pack-cat-toggle:focus-visible{
      outline:3px solid color-mix(in srgb,var(--cat-accent) 35%,white);
      outline-offset:3px;
    }
    .pack-group.collapsed .pack-cat-toggle{
      transform:scale(.94);
      opacity:.88;
    }
    .pack-group.collapsed .pack-cat-toggle:hover{
      transform:scale(1.02);

    .env-layout-panel-head h3{
      margin:4px 0 3px;
      color:#184b39;
      font-size:18px;
    }
    .env-layout-panel-head p{
      margin:0;
      color:#6f7c75;
      font-size:10px;
      line-height:1.4;
    }
    .env-layout-rows{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .env-layout-row{
      display:grid;
      grid-template-columns:34px minmax(0,1fr) 62px;
      gap:8px;
      align-items:center;
      border:1px solid #e3ddcf;
      border-radius:13px;
      background:#fff;
      padding:8px;
      min-width:0;

      font-size:18px;

      min-width:0;
      color:#254f3f;
      font-size:10px;
      line-height:1.25;
      font-weight:900;

    .env-layout-position{
      width:100%;
      min-width:0;
      border:1px solid #d8d7cb;
      border-radius:9px;
      background:#fafbf6;
      color:#173e31;
      padding:7px 5px;
      font-size:10px;
      font-weight:900;
    }
    .env-layout-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    @media(max-width:1000px){
      .env-category-strip.env-category-grid{
        grid-template-columns:repeat(4,minmax(0,1fr)) !important;
      }
      .env-layout-rows{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

    /* ===== v52: echte mobiele app-opbouw ===== */
    .mobile-app-nav,
    .mobile-more-sheet{display:none}

    /* Middelgrote schermen: de header mag nooit de pagina breder maken. */
    @media (min-width:621px) and (max-width:1450px){
      .legacy-header{
        grid-template-columns:230px minmax(0,1fr) 96px !important;
        gap:12px !important;
      }

      .legacy-nav{
        min-width:0;
        justify-content:flex-start !important;
        overflow-x:auto !important;
        overflow-y:hidden;
        gap:12px !important;
        scrollbar-width:thin;
      }
      .legacy-nav button{flex:0 0 auto}
      .legacy-user{min-width:96px !important;padding:12px !important}

        max-width:100%;

        min-height:72px !important;

        align-items:center !important;
        gap:10px !important;
        min-width:0;
      }
      .legacy-sun{

        height:42px !important;
        margin-top:0 !important;
        font-size:22px !important;
        flex:0 0 auto;
      }
      .legacy-brand-text{
        font-size:24px !important;
        line-height:1.05 !important;
        white-space:nowrap;
      }

        margin-top:0 !important;
        min-width:44px !important;
        width:44px !important;
        height:44px !important;

        align-items:center !important;
        justify-content:center !important;
        border-radius:13px !important;

        font-size:0 !important;

      /* bottom nav */
      .mobile-app-nav{

        left:8px;
        right:8px;
        bottom:max(8px,env(safe-area-inset-bottom));
        z-index:4000;
        display:grid;
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:4px;
        padding:7px;
        border:1px solid rgba(214,205,185,.95);
        border-radius:20px;
        background:rgba(255,253,247,.96);
        backdrop-filter:blur(18px);
        box-shadow:0 12px 34px rgba(28,59,43,.20);

      .mobile-app-nav button{
        border:0;
        background:transparent;
        color:#66756d;
        border-radius:14px;
        min-width:0;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
        cursor:pointer;

      .mobile-app-nav button span{
        font-size:18px;
        line-height:1;

        font-size:9px;
        line-height:1.05;

      .mobile-app-nav button.active{

        border:0;
        background:rgba(13,42,31,.30);
      }
      .mobile-more-panel{
        position:absolute;
        left:10px;
        right:10px;

        border-radius:22px;

        box-shadow:0 20px 55px rgba(23,61,49,.25);

      .mobile-more-grid button span{font-size:23px}

        min-width:0 !important;

      }

<script>



const PROFILE_NAMES=["Waldo","Brigitte"];

function actorName(){
  const value=localStorage.getItem("vakantie_actor");
  return PROFILE_NAMES.includes(value) ? value : "Waldo";
}

function hasChosenActor(){
  return PROFILE_NAMES.includes(localStorage.getItem("vakantie_actor"));
}

function applyActorUI(){
  const actor=actorName();
  const nameEl=document.getElementById("userButtonName");
  if(nameEl) nameEl.textContent=actor;

  document.querySelectorAll("[data-profile]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.profile===actor);
  });

  const memoryActor=document.getElementById("memoryActorName");
  if(memoryActor) memoryActor.textContent=actor;
}

function chooseActor(name){
  if(!PROFILE_NAMES.includes(name)) return;
  localStorage.setItem("vakantie_actor",name);
  applyActorUI();

  const chooser=document.getElementById("profileChooser");
  const menu=document.getElementById("profileMenu");
  if(chooser) chooser.hidden=true;
  if(menu) menu.hidden=true;
}

function setupProfileSelector(){
  const chooser=document.getElementById("profileChooser");
  const menu=document.getElementById("profileMenu");
  const userButton=document.getElementById("userButton");

  applyActorUI();

  if(!hasChosenActor() && chooser){
    chooser.hidden=false;
  }

  if(userButton && menu){
    userButton.addEventListener("click",(event)=>{
      event.stopPropagation();
      menu.hidden=!menu.hidden;
      applyActorUI();
    });
  }

  document.querySelectorAll("[data-profile]").forEach(btn=>{
    btn.addEventListener("click",()=>chooseActor(btn.dataset.profile));
  });

  document.querySelectorAll("[data-choose-profile]").forEach(btn=>{
    btn.addEventListener("click",()=>chooseActor(btn.dataset.chooseProfile));
  });

  document.addEventListener("click",(event)=>{
    if(!menu || menu.hidden) return;
    if(menu.contains(event.target) || userButton?.contains(event.target)) return;
    menu.hidden=true;
  });
}

function slugifyTripName(name){
  return String(name||"reis")
    .toLocaleLowerCase("nl-NL")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,45) || "reis";
}

function uniqueTripId(name){
  const base=slugifyTripName(name);
  let id=base;
  let n=2;
  while(tripCatalog[id]) id=`${base}-${n++}`;
  return id;
}

function packingBelongsToTrip(item,tripId=currentTripId){
  const id=String(item.id||"");
  if(tripId==="vakantie-2026"){
    return !id.includes("::") || id.startsWith("vakantie-2026::");
  }
  return id.startsWith(tripId+"::");
}

  if(currentTripId==="vakantie-2026") return rawId;
  return `${currentTripId}::${rawId}`;
}

  }));

  automaticChecklistEnsuredForTrip=currentTripId;

let supabaseReadyPromise = null;

function ensureSupabaseReady(){
  if(client) return Promise.resolve(client);
  if(!supabaseReadyPromise){
    supabaseReadyPromise=connect()
      .then(()=>{
        if(!client) throw new Error("Supabase-client is niet beschikbaar.");
        return client;
      })
      .catch(err=>{
        supabaseReadyPromise=null;
        throw err;
      });
  }
  return supabaseReadyPromise;
}

function updateTechnicalStatus(){
  const status=document.getElementById("technicalSupabaseStatus");
  if(!status) return;
  if(client){
    status.textContent="Verbonden";
    status.className="technical-ok";
    return;
  }
  status.textContent="Verbinden…";
  status.className="";
  ensureSupabaseReady().then(()=>{
    status.textContent="Verbonden";
    status.className="technical-ok";
  }).catch(()=>{
    status.textContent="Niet verbonden";

async function checkTechnicalVersion(){
  const status=document.getElementById("technicalVersionStatus");
  if(!status) return;
  status.textContent="Controleren…";
  status.className="";
  try{
    const response=await fetch("./?version-check="+Date.now(),{cache:"no-store"});
    if(!response.ok) throw new Error("Controle mislukt");
    const html=await response.text();
    const match=html.match(/<meta\s+name=["']app-version["']\s+content=["'](\d+)["']/i);
    if(!match) throw new Error("Geen versie-informatie gevonden");
    const online=Number(match[1]);
    const current=Number(document.querySelector('meta[name="app-version"]')?.content)||122;
    status.textContent=online>current ? "Nieuwe versie v"+online+" beschikbaar" : "Je gebruikt de nieuwste versie";
    status.className=online>current ? "technical-warn" : "technical-ok";
  }catch(err){
    status.textContent="Kon online versie niet controleren";
    status.className="technical-error";
  }
}

async function connect(){
  let authenticated=false;
  const url = sbUrl.value.trim().replace(/\/rest\/v1\/?$/,"");
  const key = sbKey.value.trim();
  const msg = document.getElementById("connectMsg");
  const top = document.getElementById("topStatus");

  if(!url || !key){ msg.textContent="Vul URL en publishable key in."; return; }

  try{
    msg.textContent="Verbinden…";
    client = supabase.createClient(url,key);
    const {data:{session}} = await client.auth.getSession();
    if(!session){
      const {error}=await client.auth.signInAnonymously();
      if(error) throw error;
    }
    authenticated=true;
    localStorage.setItem("vakantie_sb_url",url);
    localStorage.setItem("vakantie_sb_key",key);

    msg.innerHTML='<span class="ok">✓ Verbonden. Data worden nu uit Supabase geladen.</span>';
    top.textContent="Supabase verbonden";
    top.className="status-pill ok";

    await ensureTripBootstrap();
    await ensurePackingIconDatabase();
    await loadTripManager();
    await Promise.all([loadPacking(),loadCosts(),loadMemories()]);
    if(!realtimeSubscribed){
      subscribeRealtime();
      realtimeSubscribed=true;
    }
    await refreshTripDrivenUI();
    return client;
  }catch(err){
    // Houd een geldige client beschikbaar als alleen een aanvullend scherm faalt.
    if(!authenticated) client=null;
    console.error(err);
    msg.innerHTML='<span class="error">Verbinding mislukt: '+esc(err.message)+'</span>';
    top.textContent="Verbinding mislukt";
    top.className="status-pill bad";
    throw err;
  }
}


async function ensureTripBootstrap(){
  if(!client) return;

  const {data,error}=await client
    .from("memories")
    .select("id,trip_id,stop_id,mood,text,created_by,created_at,updated_at")
    .in("mood",[TRIP_META_MOOD,TRIP_STOP_MOOD]);

  if(error){
    console.warn("Reisbeheer metadata kon niet worden gelezen:",error);
    return;
  }

  const rows=data||[];
  const has2026=rows.some(r=>r.mood===TRIP_META_MOOD && r.trip_id==="vakantie-2026");

  if(!has2026){
    const inserts=[
      {
        trip_id:currentTripId,
        stop_id:null,
        mood:TRIP_META_MOOD,
        text:JSON.stringify(DEFAULT_TRIP_2026),
        created_by:"Systeem",
        updated_at:new Date().toISOString()
      },
      ...DEFAULT_STOPS_2026.map(stop=>({
        trip_id:currentTripId,
        stop_id:stop.id,
        mood:TRIP_STOP_MOOD,
        text:JSON.stringify(stop),
        created_by:"Systeem",
        updated_at:new Date().toISOString()
      }))
    ];

    const {error:insertError}=await client.from("memories").insert(inserts);
    if(insertError) console.warn("Startreis metadata kon niet worden opgeslagen:",insertError);
  }
}

async function loadTripManager(){
  if(!client){
    tripCatalog={
      "vakantie-2026":{meta:DEFAULT_TRIP_2026,stops:DEFAULT_STOPS_2026,metaRow:null}
    };
    return;
  }

  const {data,error}=await client
    .from("memories")
    .select("id,trip_id,stop_id,mood,text,created_by,created_at,updated_at")
    .in("mood",[TRIP_META_MOOD,TRIP_STOP_MOOD])
    .order("created_at",{ascending:true});

  if(error){
    console.error(error);
    tripCatalog={
      "vakantie-2026":{meta:DEFAULT_TRIP_2026,stops:DEFAULT_STOPS_2026,metaRow:null}
    };
    return;
  }

  tripSystemRows=data||[];
  const catalog={};

  for(const row of tripSystemRows){
    const id=row.trip_id;
    if(!id) continue;
    (catalog[id] ||= {meta:null,stops:[],metaRow:null});

    if(row.mood===TRIP_META_MOOD){
      const parsed=safeJsonParse(row.text,{});
      catalog[id].meta={
        id,
        name:parsed.name || id,
        home:parsed.home || "Nijkerk",
        start_date:parsed.start_date || "",
        end_date:parsed.end_date || "",
        status:parsed.status || "planned",
        normal_range_km:Number(parsed.normal_range_km)||400,
        current_range_km:Number(parsed.current_range_km)||Number(parsed.normal_range_km)||400,
        reserve_pct:Number(parsed.reserve_pct)||20,
        created_at:parsed.created_at || row.created_at
      };
      catalog[id].metaRow=row;
    }

    if(row.mood===TRIP_STOP_MOOD){
      const parsed=safeJsonParse(row.text,{});
      catalog[id].stops.push({
        id:row.stop_id || parsed.id || `stop-${row.id}`,
        ...parsed,
        _row_id:row.id
      });
    }
  }

  if(!catalog["vakantie-2026"]){
    catalog["vakantie-2026"]={
      meta:DEFAULT_TRIP_2026,
      stops:DEFAULT_STOPS_2026,
      metaRow:null
    };
  }

  tripCatalog=catalog;

  if(!tripCatalog[currentTripId]){
    const active=Object.values(tripCatalog).find(x=>x.meta?.status==="active");
    currentTripId=active?.meta?.id || Object.keys(tripCatalog)[0] || "vakantie-2026";
    localStorage.setItem("vakantie_current_trip",currentTripId);
  }

  renderTripManager();
}

async function saveTripMeta(meta){
  const entry=tripCatalog[meta.id];
  const payload={
    id:meta.id,
    name:meta.name,
    home:meta.home,
    start_date:meta.start_date,
    end_date:meta.end_date,
    status:meta.status,
    normal_range_km:Number(meta.normal_range_km)||400,
    current_range_km:Number(meta.current_range_km)||Number(meta.normal_range_km)||400,
    reserve_pct:Number(meta.reserve_pct)||20,
    created_at:meta.created_at || new Date().toISOString()
  };

  if(entry?.metaRow?.id){
    const {error}=await client
      .from("memories")
      .update({text:JSON.stringify(payload),updated_at:new Date().toISOString(),created_by:actorName()})
      .eq("id",entry.metaRow.id);
    if(error) throw error;
  }else{
    const {error}=await client
      .from("memories")
      .insert({
        trip_id:meta.id,
        stop_id:null,
        mood:TRIP_META_MOOD,
        text:JSON.stringify(payload),
        created_by:actorName(),
        updated_at:new Date().toISOString()
      });
    if(error) throw error;
  }

  await loadTripManager();
}

function currentTripPackingSource(items){
  return items.filter(item=>packingBelongsToTrip(item,currentTripId));
}

async function copyPackingToTrip(newTripId){
  const {data,error}=await client.from("packing").select("*");
  if(error) throw error;

  const source=currentTripPackingSource(data||[]);
  if(!source.length) return 0;

  const now=new Date().toISOString();
  const copies=source.map((item,index)=>({
    id:`${newTripId}::${String(item.id||`item-${index}`).replace(/^[^:]+::/,"")}`,
    name:item.name,
    category:canonicalPackingCategory(item.category),
    owner:item.owner,
    quantity:item.quantity||1,
    status:"todo",
    due_date:null,
    updated_at:now,
    updated_by:actorName()
  }));

  // insert in chunks to keep the browser request small
  for(let i=0;i<copies.length;i+=100){
    const {error:copyError}=await client.from("packing").insert(copies.slice(i,i+100));
    if(copyError) throw copyError;
  }

  return copies.length;
}

async function createNewTrip(){
  if(!client){ alert("De app moet eerst met Supabase verbonden zijn."); return; }

  const name=document.getElementById("newTripName").value.trim();
  const home=document.getElementById("newTripHome").value.trim() || "Nijkerk";
  const start=document.getElementById("newTripStart").value;
  const end=document.getElementById("newTripEnd").value;
  const normalRange=Math.max(50,Number(document.getElementById("newTripRange").value)||400);
  const reserve=Math.min(40,Math.max(5,Number(document.getElementById("newTripReserve").value)||20));
  const copyPacking=document.getElementById("newTripCopyPacking").checked;
  const msg=document.getElementById("newTripMsg");

  if(!name || !start || !end){
    msg.innerHTML='<div class="notice">Vul naam, startdatum en einddatum in.</div>';
    return;
  }
  if(end<start){
    msg.innerHTML='<div class="notice">De einddatum moet na de startdatum liggen.</div>';
    return;
  }

  const id=uniqueTripId(name);
  const meta={
    id,name,home,start_date:start,end_date:end,status:"planned",
    normal_range_km:normalRange,current_range_km:normalRange,reserve_pct:reserve,
    created_at:new Date().toISOString()
  };

  try{
    await saveTripMeta(meta);
    let copied=0;
    if(copyPacking) copied=await copyPackingToTrip(id);

    currentTripId=id;
    localStorage.setItem("vakantie_current_trip",id);
    await loadTripManager();
    await Promise.all([loadPacking(),loadCosts(),loadMemories()]);
    await refreshTripDrivenUI();

    document.getElementById("newTripPanel").hidden=true;
    msg.innerHTML="";
    document.getElementById("newTripName").value="";
    alert(`Reis "${name}" is aangemaakt${copied ? ` met ${copied} paklijstitems` : ""}. Voeg nu je verblijven toe.`);
  }catch(err){
    console.error(err);
    msg.innerHTML='<div class="notice"><span class="error">'+esc(err.message)+'</span></div>';
  }
}

async function addStayToCurrentTrip(){
  if(!client) return;

  const region=document.getElementById("stayRegion").value.trim();
  const city=document.getElementById("stayCity").value.trim();
  const hotel=document.getElementById("stayHotel").value.trim();
  const address=document.getElementById("stayAddress").value.trim();
  const arrival=document.getElementById("stayArrival").value;
  const departure=document.getElementById("stayDeparture").value;
  const country=document.getElementById("stayCountry").value.trim().toUpperCase();
  const website=document.getElementById("stayWebsite").value.trim();
  const msg=document.getElementById("stayMsg");

  if(!city || !hotel || !arrival || !departure){
    msg.innerHTML='<div class="notice">Vul minimaal plaats, hotel, aankomst en vertrek in.</div>';
    return;
  }
  if(departure<arrival){
    msg.innerHTML='<div class="notice">Vertrek moet na aankomst liggen.</div>';
    return;
  }

  let id=slugifyTripName(city);
  const used=new Set(tripStops().map(x=>x.id));
  let n=2,base=id;
  while(used.has(id)) id=`${base}-${n++}`;

  const stop={
    id,
    region:region||city,
    city,
    place:city,
    hotel,
    address,
    arrival,
    departure,
    country:country||"",
    geocode:city,
    website
  };

  const {error}=await client.from("memories").insert({
    trip_id:currentTripId,
    stop_id:id,
    mood:TRIP_STOP_MOOD,
    text:JSON.stringify(stop),
    created_by:actorName(),
    updated_at:new Date().toISOString()
  });

  if(error){
    msg.innerHTML='<div class="notice"><span class="error">'+esc(error.message)+'</span></div>';
    return;
  }

  ["stayRegion","stayCity","stayHotel","stayAddress","stayArrival","stayDeparture","stayCountry","stayWebsite"]
    .forEach(id=>document.getElementById(id).value="");

  document.getElementById("stayEditor").hidden=true;
  msg.innerHTML="";
  await loadTripManager();
  await refreshTripDrivenUI();
}

const COST_DEPOSIT_PREFIX="[AANBETALING] ";

function isDepositCost(row){
  return String(row?.description||"").startsWith(COST_DEPOSIT_PREFIX);
}

function visibleCostDescription(value){
  const text=String(value||"");
  return text.startsWith(COST_DEPOSIT_PREFIX) ? text.slice(COST_DEPOSIT_PREFIX.length) : text;
}

function storedCostDescription(value,isDeposit){
  const clean=visibleCostDescription(value).trim();
  return (isDeposit ? COST_DEPOSIT_PREFIX : "")+(clean || "Kostenpost");
}

function hotelCostTotal(stopId){
  return costData
    .filter(row=>row.stop_id===stopId && !isDepositCost(row))
    .reduce((sum,row)=>sum+(Number(row.amount_cents)||0),0);
}

}

async function saveHotelRoomDetails(stopId){

  if(!stop) return;

  const room={
    type:document.getElementById(`roomType-${stopId}`)?.value.trim()||"",
    number:document.getElementById(`roomNumber-${stopId}`)?.value.trim()||"",
    location:document.getElementById(`roomLocation-${stopId}`)?.value.trim()||"",

    notes:document.getElementById(`roomNotes-${stopId}`)?.value.trim()||"",
    updated_by:actorName(),
    updated_at:new Date().toISOString()
  };

  const msg=document.getElementById(`roomMsg-${stopId}`);

  if(client && stop._row_id){
    const payload=stripInternalStopFields({...stop,room});
    const {error}=await client
      .from("memories")
      .update({
        text:JSON.stringify(payload),
        updated_at:new Date().toISOString(),
        created_by:actorName()
      })
      .eq("id",stop._row_id);

    if(error){
      if(msg) msg.textContent="Opslaan mislukt: "+error.message;

function roomPhotoPrefix(stopId){
  return `ROOMPHOTO|${stopId}|`;
}

function roomPhotoCaption(fileName,stopId){
  const prefix=roomPhotoPrefix(stopId);
  if(!String(fileName||"").startsWith(prefix)) return "";
  const rest=String(fileName).slice(prefix.length);
  const split=rest.indexOf("|");
  if(split<0) return "";
  try{return decodeURIComponent(rest.slice(0,split))}catch(e){return ""}
}

function imageFilesFromInput(input){

// Kamerfoto's worden bewust direct gedeeld geüpload; deze tijdelijke referentie
// houdt dezelfde gekozen bestanden beschikbaar voor de knop naar Foto's.
const roomPhotoFilesForPhone=new Map();

function setPhotoPhoneStatus(element,message,isError=false){
  if(!element) return;
  element.textContent=message||"";
  element.classList.toggle("error",Boolean(isError));
}

async function saveImageFilesToPhone(files,statusElement){
  const selected=(files||[]).filter(file=>String(file?.type||"").startsWith("image/"));
  if(!selected.length){
    setPhotoPhoneStatus(statusElement,"Kies eerst minimaal één foto.",true);
    return;
  }

  let canShareFiles=false;
  if(typeof navigator.share==="function"){
    try{
      canShareFiles=!navigator.canShare || navigator.canShare({files:selected});
    }catch(error){
      console.warn("Bestandsdeelkaart niet beschikbaar",error);
    }
  }

  if(canShareFiles){
    try{
      await navigator.share({
        files:selected,
        title:"Vakantie 2026",
        text:"Kies ‘Bewaar afbeelding’ om de foto in Foto’s op te slaan."
      });
      setPhotoPhoneStatus(statusElement,"✓ Deelkaart geopend. Kies ‘Bewaar afbeelding’.");
      return;
    }catch(error){
      if(error?.name==="AbortError"){
        setPhotoPhoneStatus(statusElement,"Delen geannuleerd; de foto staat nog wel in de app.");
        return;
      }
      console.warn("Deelkaart voor foto kon niet worden geopend",error);
    }
  }

  // Desktop en oudere browsers hebben soms geen bestands-deelkaart.
  selected.forEach((file,index)=>{
    const url=URL.createObjectURL(file);
    const link=document.createElement("a");
    link.href=url;
    link.download=file.name || `vakantie-foto-${index+1}.jpg`;
    link.rel="noopener";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  });
  setPhotoPhoneStatus(statusElement,
    selected.length===1
      ? "✓ Download gestart. Open de foto en kies ‘Bewaar afbeelding’."
      : `✓ ${selected.length} downloads gestart. Bewaar de afbeeldingen daarna in Foto’s.`);
}

async function loadRoomPhotosForStop(stopId){
  const grid=document.getElementById(`roomPhotoGrid-${stopId}`);
  if(!grid || !client) return;

  try{
    const {data,error}=await client
      .from("photos")
      .select("*")
      .eq("trip_id",currentTripId)
      .eq("stop_id",stopId)
      .is("memory_id",null)
      .order("created_at",{ascending:true});

    if(error) throw error;

    const roomPhotos=(data||[])
      .filter(p=>String(p.file_name||"").startsWith(roomPhotoPrefix(stopId)))
      .slice(0,6);

    if(!roomPhotos.length){
      grid.innerHTML=`
        <div class="old-room-photo-empty">
          <span>📷</span>
          <span><strong>Nog geen kamerfoto’s</strong><small>Voeg straks bijvoorbeeld de kamer, het uitzicht of balkon toe.</small></span>
        </div>`;
      return;
    }

    const resolved=[];
    for(const photo of roomPhotos){
      try{
        const {data:signed,error:signedError}=await client.storage
          .from("vakantie-media")
          .createSignedUrl(photo.storage_path,60*60);
        if(signedError) throw signedError;
        resolved.push({...photo,signed_url:signed.signedUrl});
      }catch(err){
        console.warn("Kamerfoto kon niet worden geladen",err);
      }
    }

    grid.innerHTML=resolved.map(photo=>{
      const caption=roomPhotoCaption(photo.file_name,stopId);
      return `<div
        class="old-room-photo"
        data-room-photo-id="${esc(photo.id)}"
        data-room-photo-path="${esc(photo.storage_path)}"
        role="button"
        tabindex="0"
        aria-pressed="false"
        title="Klik om deze foto te selecteren"
      >
        <span class="old-room-photo-select">○</span>
        <img src="${esc(photo.signed_url)}" alt="${esc(caption||"Kamerfoto")}">
        ${caption ? `<div class="old-room-photo-caption">${esc(caption)}</div>` : ""}
      </div>`;
    }).join("");

    bindRoomPhotoSelection(stopId);
  }catch(err){
    console.error(err);
    grid.innerHTML='<div class="old-room-photo-empty"><span>📷</span><span><strong>Foto’s konden niet worden geladen</strong><small>'+esc(err.message)+'</small></span></div>';
  }
}

async function deleteSelectedRoomPhotos(stopId){
  if(!client) return;

  const selected=selectedRoomPhotos(stopId);
  if(!selected.length) return;

  const count=selected.length;
  const confirmed=confirm(
    count===1
      ? "Deze kamerfoto echt verwijderen?"
      : `Deze ${count} kamerfoto’s echt verwijderen?`
  );
  if(!confirmed) return;

  const button=document.querySelector(`[data-delete-room-photos="${CSS.escape(stopId)}"]`);
  const status=document.getElementById(`roomPhotoStatus-${stopId}`);

  if(button){
    button.disabled=true;
    button.textContent="Verwijderen…";
  }
  if(status) status.textContent=`${count} foto${count===1?"":"’s"} verwijderen…`;

  let deleted=0;
  const failures=[];

  for(const photo of selected){
    try{
      // Eerst het bestand uit de private storage verwijderen.
      const {error:storageError}=await client.storage
        .from("vakantie-media")
        .remove([photo.storage_path]);

      if(storageError) throw storageError;

      // Daarna de bijbehorende databaseverwijzing verwijderen.
      const {error:dbError}=await client
        .from("photos")
        .delete()
        .eq("id",photo.id);

      if(dbError) throw dbError;

      deleted++;
    }catch(err){
      console.error("Kamerfoto verwijderen mislukt",photo,err);
      failures.push(err?.message||"Onbekende fout");
    }
  }

  if(status){
    status.textContent=failures.length
      ? `⚠ ${deleted}/${count} verwijderd. ${failures[0]}`
      : `✓ ${deleted} foto${deleted===1?"":"’s"} verwijderd`;
  }

  await loadRoomPhotosForStop(stopId);
}

async function uploadRoomPhotos(stopId){
  if(!client){
    alert("Maak eerst verbinding met Supabase.");
    return;
  }

  const input=document.getElementById(`roomPhotos-${stopId}`);
  const captionInput=document.getElementById(`roomCaption-${stopId}`);
  const status=document.getElementById(`roomPhotoStatus-${stopId}`);
  const files=[...(input?.files||[])];

  if(!files.length) return;

  const {data:existing,error:existingError}=await client
    .from("photos")
    .select("id,file_name")
    .eq("trip_id",currentTripId)
    .eq("stop_id",stopId)
    .is("memory_id",null);

  if(existingError){
    status.textContent="Foto’s controleren mislukt: "+existingError.message;
    return;
  }

  const currentCount=(existing||[])
    .filter(p=>String(p.file_name||"").startsWith(roomPhotoPrefix(stopId)))
    .length;

  const remaining=Math.max(0,6-currentCount);
  if(!remaining){
    status.textContent="Er staan al zes kamerfoto’s bij dit hotel.";
    input.value="";
    return;
  }

  const selected=files.slice(0,remaining);
  const caption=captionInput?.value.trim()||"";

  status.textContent=`${selected.length} foto${selected.length===1?"":"’s"} uploaden…`;

  let uploaded=0;

  for(const file of selected){
    const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"").toLowerCase()||"jpg";
    const storageName=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const storagePath=`${currentTripId}/rooms/${stopId}/${storageName}`;
    const storedFileName=`${roomPhotoPrefix(stopId)}${encodeURIComponent(caption)}|${file.name}`;

    const {error:uploadError}=await client.storage
      .from("vakantie-media")
      .upload(storagePath,file,{
        contentType:file.type||"image/jpeg",
        upsert:false
      });

    if(uploadError){
      console.error(uploadError);
      continue;
    }

    const {error:insertError}=await client
      .from("photos")
      .insert({
        memory_id:null,
        trip_id:currentTripId,
        stop_id:stopId,
        storage_path:storagePath,
        file_name:storedFileName,
        mime_type:file.type||null,
        created_by:actorName()
      });

    if(insertError){
      console.error(insertError);
      continue;
    }

    uploaded++;
  }

  input.value="";
  if(captionInput) captionInput.value="";
  status.textContent=`✓ ${uploaded} kamerfoto${uploaded===1?"":"’s"} gedeeld`;
  await loadRoomPhotosForStop(stopId);
}

async function geocodeGeneralPlace(query){
  if(!query) throw new Error("Geen vertrekpunt of bestemming opgegeven.");

  const url="https://nominatim.openstreetmap.org/search?"+
    new URLSearchParams({q:query,format:"jsonv2",limit:"1","accept-language":"nl"});

  const response=await fetch(url,{headers:{"Accept":"application/json"}});
  if(!response.ok) throw new Error("Locatie kon niet worden opgezocht.");
  const data=await response.json();
  if(!data?.length) throw new Error(`Locatie niet gevonden: ${query}`);
  return {lat:Number(data[0].lat),lon:Number(data[0].lon),label:data[0].display_name};
}

function nextTripLeg(){
  const meta=tripMeta();
  const stops=tripStops();
  if(!stops.length) return null;

  const today=dateOnlyLocal();

  if(today < (stops[0].arrival||meta.start_date)){
    return {
      fromLabel:meta.home||"Thuis",
      fromQuery:meta.home||"Nijkerk",
      toLabel:stops[0].hotel||stops[0].city,
      toQuery:stops[0].address||stops[0].city
    };
  }

  for(let i=0;i<stops.length;i++){
    const stop=stops[i];
    if(today < (stop.departure||"9999-12-31")){
      if(i<stops.length-1){
        const next=stops[i+1];
        return {
          fromLabel:stop.hotel||stop.city,
          fromQuery:stop.address||stop.city,
          toLabel:next.hotel||next.city,
          toQuery:next.address||next.city
        };
      }
      return {
        fromLabel:stop.hotel||stop.city,
        fromQuery:stop.address||stop.city,
        toLabel:meta.home||"Thuis",
        toQuery:meta.home||"Nijkerk"
      };
    }
  }

  return {
    fromLabel:stops[stops.length-1].hotel||stops[stops.length-1].city,
    fromQuery:stops[stops.length-1].address||stops[stops.length-1].city,
    toLabel:meta.home||"Thuis",
    toQuery:meta.home||"Nijkerk"
  };
}

async function routeDistanceKm(fromQuery,toQuery){
  const [from,to]=await Promise.all([
    geocodeGeneralPlace(fromQuery),
    geocodeGeneralPlace(toQuery)
  ]);

  const url=`https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=false&steps=false`;
  const response=await fetch(url);
  if(!response.ok) throw new Error("Rijafstand kon niet worden berekend.");

  const json=await response.json();
  if(json.code!=="Ok" || !json.routes?.length) throw new Error("Geen autoroute gevonden.");

  return {
    km:json.routes[0].distance/1000,
    minutes:json.routes[0].duration/60,
    from,
    to
  };
}

function rangeAdviceForDistance(km){
  const meta=tripMeta();
  const current=Number(meta.current_range_km)||Number(meta.normal_range_km)||400;
  const reserve=Number(meta.reserve_pct)||20;
  const usable=current*(1-reserve/100);
  const recommendedChargeAt=current*0.70;

  if(km<=usable){
    return {
      level:"good",
      headline:"Geen laadstop nodig",
      text:`${Math.round(km)} km past binnen de veilige ${Math.round(usable)} km die je met ${current} km actueel bereik en ${reserve}% reserve gebruikt.`
    };
  }

  const estimatedStops=Math.max(1,Math.ceil(km/usable)-1);
  return {
    level:"warning",
    headline:`Laden onderweg: ongeveer ${estimatedStops} stop${estimatedStops===1?"":"s"}`,
    text:`Plan de eerste laadmogelijkheid rond ${Math.round(recommendedChargeAt)} km. De etappe is circa ${Math.round(km)} km en je veilige bereik is ongeveer ${Math.round(usable)} km.`
  };
}

async function calculateNextLegRange(showLoading=true){
  const box=document.getElementById("rangeAdvice");
  const leg=nextTripLeg();

  if(!leg){
    box.className="range-advice error";
    box.textContent="Voeg eerst minimaal één verblijf aan deze reis toe.";
    return null;
  }

  if(showLoading){
    box.className="range-advice";
    box.textContent=`Afstand berekenen: ${leg.fromLabel} → ${leg.toLabel}…`;
  }

  try{
    const route=await routeDistanceKm(leg.fromQuery,leg.toQuery);
    const advice=rangeAdviceForDistance(route.km);
    box.className=`range-advice ${advice.level}`;
    box.innerHTML=
      `<strong>${esc(leg.fromLabel)} → ${esc(leg.toLabel)} · ${Math.round(route.km)} km</strong><br>`+
      `${esc(advice.headline)}. ${esc(advice.text)}`;

    renderRangeCard({
      leg,
      route,
      advice
    });

    return {leg,route,advice};
  }catch(err){
    console.error(err);
    box.className="range-advice error";
    box.textContent=err.message;
    renderRangeCard();
    return null;
  }
}

function renderRangeCard(calculation=null){

  const meta=tripMeta();

  const normal=Number(meta.normal_range_km)||400;

  card.classList.remove("good","warning","bad");

  let sub=`${normal} km normaal · ${meta.reserve_pct||20}% reserve`;

  if(calculation?.advice){
    if(calculation.advice.level==="good") card.classList.add("good");
    if(calculation.advice.level==="warning") card.classList.add("warning");
    sub=`${Math.round(calculation.route.km)} km volgende etappe · ${calculation.advice.headline}`;

  card.innerHTML=`
    <span>RIJBEREIK</span>
    <div class="range-card-main"><strong>${current}</strong><b>km</b></div>
    <small class="range-card-sub">${esc(sub)}</small>`;
}

  }

  // Bestaande EV-items horen gewoon bij Auto.

  const {error:mergeError}=await client
    .from("packing")
    .update({category:"Auto"})
    .eq("category","Elektrische auto");

  if(mergeError){
    console.warn("Categorie Elektrische auto kon niet automatisch worden samengevoegd:",mergeError);
  }

  const {data,error}=await client.from("packing").select("*").order("category").order("name");
  if(error){ document.getElementById("packingList").innerHTML='<div class="empty">'+esc(error.message)+'</div>'; return; }

  packingData=(data||[])
    .filter(item=>packingBelongsToTrip(item,currentTripId))
    .map(item=>({
      ...item,
      category:canonicalPackingCategory(item.category)
    }));

  renderPacking();
  document.getElementById("kpiPacking").textContent=packingData.length;
  await learnPackingIconsFromItems(packingData);

function canonicalPackingCategory(category){

}

function packingTripDays(){
  const meta=tripMeta();
  const start=new Date((meta.start_date||"")+"T12:00:00");
  const end=new Date((meta.end_date||"")+"T12:00:00");
  if(Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 1;
  return Math.max(1,Math.round((end-start)/86400000)+1);
}

function defaultPackingCalculation(item){
  const name=String(item?.name||"").toLowerCase();
  if(name.includes("luier")) return {unitAmount:5,timesPerDay:1,unit:"stuks",days:packingTripDays(),note:""};
  if(name.includes("paracetamol")) return {unitAmount:4,timesPerDay:1,unit:"stuks",days:packingTripDays(),note:""};
  return {unitAmount:0,timesPerDay:0,unit:"stuks",days:packingTripDays(),note:""};
}

function packingDetailsFor(item){
  const saved=packingDetails[item.id]||{};
  const details={...defaultPackingCalculation(item),...saved};
  if(saved.unitAmount===undefined && (saved.dayQty!==undefined || saved.nightQty!==undefined)){
    details.unitAmount=(Number(saved.dayQty)||0)+(Number(saved.nightQty)||0);
    details.timesPerDay=1;
  }
  details.unit=["stuks","kg","gram"].includes(details.unit) ? details.unit : "stuks";
  if(!Array.isArray(details.subItems) || !details.subItems.length){
    const hasProposal=(Number(details.unitAmount)||0)>0 && (Number(details.timesPerDay)||0)>0;
    details.subItems=[hasProposal ? {
      label:"",
      unitAmount:details.unitAmount,
      timesPerDay:details.timesPerDay,
      unit:details.unit,
      days:details.days||packingTripDays()
    } : {label:"",unitAmount:"",timesPerDay:"",unit:"",customUnit:"",days:""}];
  }
  details.subItems=details.subItems.map(sub=>{
    const label=String(sub?.label||"").trim();
    const unitAmount=sub?.unitAmount==="" || sub?.unitAmount===null ? "" : Math.max(0,Number(sub?.unitAmount)||0);
    const timesPerDay=sub?.timesPerDay==="" || sub?.timesPerDay===null ? "" : Math.max(0,Number(sub?.timesPerDay)||0);
    const unused=!label && !(Number(unitAmount)>0) && !(Number(timesPerDay)>0);
    if(unused && !sub?.autoDays) return {label:"",unitAmount:"",timesPerDay:"",unit:"",customUnit:"",days:""};
    return {
      label,
      unitAmount,
      timesPerDay,
      unit:sub?.unit==="" ? "" : (["stuks","kg","gram","euro","custom"].includes(sub?.unit) ? sub.unit : "stuks"),
      customUnit:String(sub?.customUnit||"").trim(),
      days:sub?.days==="" || sub?.days===null ? "" : Math.max(0,Number(sub?.days)||0),
      autoDays:Boolean(sub?.autoDays)
    };
  });
  if(!saved.recipientsSeparated && details.subItems.length===1 && details.subItems[0].label===packingOwnerName(item.owner)){
    details.subItems[0].label="";
  }
  return details;
}

function rememberOpenPackingExtras(){

    const id=details.closest('[data-pack-row]')?.dataset.packRow;
    if(id) openPackingExtraIds.add(id);

}

function packingCalculationResult(details){
  const totals={};
  (details.subItems||[]).forEach(sub=>{
    const amount=Math.max(0,Number(sub.unitAmount)||0);
    if(!(amount>0)) return;
    const unit=sub.unit==="custom" ? `custom:${String(sub.customUnit||"").trim()}` : (["stuks","kg","gram","euro"].includes(sub.unit) ? sub.unit : "stuks");
    if(unit==="custom:") return;
    const timesPerDay=Math.max(0,Number(sub.timesPerDay)||0);
    const days=Math.max(0,Number(sub.days)||0);
    const total=amount*(timesPerDay>0 ? timesPerDay : 1)*(days>0 ? days : 1);
    totals[unit]=(totals[unit]||0)+total;
  });
  return {totals,total:Object.values(totals).reduce((sum,value)=>sum+value,0)};
}

function packingUnitLabel(unit,total){
  if(unit.startsWith("custom:")) return unit.slice(7);
  if(unit==="kg") return "kg";
  if(unit==="gram") return "gram";
  if(unit==="euro") return "euro";
  return Number(total)===1 ? "stuk" : "stuks";
}

function packingResultText(calculation,itemName=""){
  const itemLabel=String(itemName||"").trim().toLocaleLowerCase("nl-NL");
  const parts=Object.entries(calculation.totals||{})
    .filter(([,total])=>total>0)
    .map(([unit,total])=>{
      if(unit==="euro") return `${total.toLocaleString("nl-NL",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2})}${itemLabel ? ` ${itemLabel}` : ""}`;
      const amount=total.toLocaleString("nl-NL",{maximumFractionDigits:2});
      if(unit==="stuks" && itemLabel) return `${amount} ${itemLabel}`;
      return `${amount} ${packingUnitLabel(unit,total)}${itemLabel ? ` ${itemLabel}` : ""}`;
    });
  return parts.length ? `Totaal: ${parts.join(" + ")}` : "Totaal: nog invullen";
}

function normalizePackingIconText(value){
  return String(value||"")
    .toLocaleLowerCase("nl-NL")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function packingItemIcon(name,category){
  const normalized=normalizePackingIconText(name);

  if(packingIconExactRules[normalized]){
    return packingIconExactRules[normalized];
  }

  // Longest/specific matches first.
  const sorted=[...PACK_ITEM_KEYWORD_ICONS].sort((a,b)=>b[0].length-a[0].length);
  for(const [keyword,icon] of sorted){
    if(normalized.includes(normalizePackingIconText(keyword))) return icon;
  }

  return packingCategoryVisual(category).icon || "📦";
}

async function rememberPackingItemIcon(name,category,forcedIcon=null,save=true){
  const normalized=normalizePackingIconText(name);
  if(!normalized) return;

  const icon=forcedIcon || packingItemIcon(name,category);
  if(packingIconExactRules[normalized]===icon) return;

  packingIconExactRules[normalized]=icon;
  if(save) await persistPackingIconDatabase();
}

async function learnPackingIconsFromItems(items){
  if(!client || packingIconLearningDone) return;
  await ensurePackingIconDatabase();

  let changed=false;

  for(const item of items||[]){
    const normalized=normalizePackingIconText(item.name);
    if(!normalized || packingIconExactRules[normalized]) continue;

    packingIconExactRules[normalized]=packingItemIcon(item.name,item.category);
    changed=true;
  }

  packingIconLearningDone=true;
  if(changed) await persistPackingIconDatabase();
}

function packingCategoryVisual(category){
  if(PACK_CATEGORY_VISUALS[category]) return PACK_CATEGORY_VISUALS[category];

  // Nieuwe eigen categorieën krijgen automatisch een stabiele, eigen accentkleur.
  let hash=0;
  for(const ch of String(category||"Overig")){
    hash=((hash<<5)-hash)+ch.charCodeAt(0);
    hash|=0;
  }
  const hue=Math.abs(hash)%360;
  return {
    icon:"📦",
    accent:`hsl(${hue} 45% 42%)`,
    tint:`hsl(${hue} 55% 95%)`,
    border:`hsl(${hue} 35% 83%)`,
    ink:`hsl(${hue} 35% 28%)`
  };
}

      .filter(Boolean)

}

function packingCategoryIsCollapsed(cat){
  return localStorage.getItem("vakantie_pack_collapsed_"+cat)==="1";
}

function updatePackingExpandButton(){
  const button=document.getElementById("toggleAllPacking");
  if(!button) return;

  const categories=packingCategoryNames();

  if(!categories.length){
    button.disabled=true;
    button.textContent="▾ Alles uitvouwen";
    return;
  }

  button.disabled=false;

  const anyCollapsed=categories.some(packingCategoryIsCollapsed);

  if(anyCollapsed){
    button.textContent="▾ Alles uitvouwen";
    button.title="Alle categorieën openen";
    button.setAttribute("aria-label","Alle paklijstcategorieën uitvouwen");
  }else{
    button.textContent="▴ Alles dichtklappen";
    button.title="Alle categorieën sluiten";
    button.setAttribute("aria-label","Alle paklijstcategorieën dichtklappen");
  }
}

function toggleAllPackingCategories(){
  const categories=packingCategoryNames();
  if(!categories.length) return;

  // Als er minimaal één categorie dicht staat, gaat alles open.
  // Alleen als alles al open staat, klappen we alles dicht.
  const shouldExpand=categories.some(packingCategoryIsCollapsed);

  categories.forEach(cat=>{
    localStorage.setItem(
      "vakantie_pack_collapsed_"+cat,
      shouldExpand ? "0" : "1"
    );
  });

  renderPacking();
}

function packingSearchText(item){
  const details=packingDetailsFor(item);
  return normalizePackingSearch([
    item.name,
    canonicalPackingCategory(item.category),
    packingOwnerName(item.owner),
    item.status,
    item.due_date,
    details.note,
    ...(details.subItems||[]).flatMap(sub=>[sub.label,sub.customUnit])

const packingListEl=document.getElementById("packingList");
packingListEl.addEventListener("click",async event=>{
  const button=event.target.closest("button");
  if(!button || !packingListEl.contains(button) || button.dataset.toggleCategory!==undefined) return;

  if(button.dataset.addPackSubitem){
    event.preventDefault();
    const id=button.dataset.addPackSubitem;
    const item=packingData.find(entry=>entry.id===id);
    if(!item) return;
    rememberOpenPackingExtras();
    openPackingExtraIds.add(String(id));
    const row=button.closest('[data-pack-row]');
    const rowTop=row?.getBoundingClientRect().top||0;
    const details=packingDetailsFor(item);
    details.subItems.push({label:"",unitAmount:"",timesPerDay:"",unit:"",customUnit:"",days:packingTripDays(),autoDays:true});
    packingDetails[id]=details;
    await persistPackingDetails();
    renderPacking();
    const newRow=document.querySelector(`[data-pack-row="${CSS.escape(String(id))}"]`);
    if(newRow) window.scrollBy(0,newRow.getBoundingClientRect().top-rowTop);
    const newSubitem=newRow?.querySelector('.pack-subitem:last-child select[data-pack-recipient-choice]');
    newSubitem?.focus({preventScroll:true});
    return;
  }
  if(button.dataset.removePackSubitem){
    event.preventDefault();
    const id=button.dataset.removePackSubitem;
    const item=packingData.find(entry=>entry.id===id);
    if(!item) return;
    rememberOpenPackingExtras();
    openPackingExtraIds.add(String(id));
    const details=packingDetailsFor(item);
    const index=Number(button.dataset.subIndex);
    if(details.subItems.length>1 && Number.isInteger(index)) details.subItems.splice(index,1);
    packingDetails[id]=details;
    await persistPackingDetails();
    renderPacking();
    return;
  }
  if(button.dataset.cycle){
    event.preventDefault();
    await cyclePacking(button.dataset.cycle);
    return;
  }
  if(button.dataset.statusId){
    event.preventDefault();
    await setPackingStatus(button.dataset.statusId,button.dataset.status);
    return;
  }
  if(button.dataset.edit){
    event.preventDefault();
    await ensureSupabaseReady();
    await editPackingItem(button.dataset.edit);
    return;
  }
  if(button.dataset.delete){
    event.preventDefault();
    await ensureSupabaseReady();
    await deletePackingItem(button.dataset.delete);
  }
});

packingListEl.addEventListener("input",event=>{
  const input=event.target.closest("[data-pack-detail],[data-pack-sub-detail]");
  if(!input) return;
  const id=input.dataset.packId;
  const item=packingData.find(entry=>entry.id===id);
  if(!item) return;

  const details=packingDetailsFor(item);
  const subField=input.dataset.packSubDetail;
  if(subField){
    const index=Number(input.dataset.subIndex);
    if(!details.subItems[index]) return;
    details.subItems[index][subField]=(subField==="label" || subField==="unit" || subField==="customUnit") ? input.value : (input.value==="" ? "" : Math.max(0,Number(input.value)||0));
    if(subField==="unit"){
      const wrap=input.closest(".pack-subitem")?.querySelector("[data-custom-unit-wrap]");
      if(wrap) wrap.hidden=input.value!=="custom";
    }
  }else{
    const field=input.dataset.packDetail;
    details[field]=field==="note" ? input.value : Math.max(0,Number(input.value)||0);
  }
  packingDetails[id]=details;

  const calculation=packingCalculationResult(details);
  const resultText=packingResultText(calculation,item.name);
  const panel=input.closest(".pack-extra");
  const resultEl=panel?.querySelector("[data-pack-result]");
  const summaryResult=panel?.querySelector("summary span");
  const mainResult=panel?.closest("[data-pack-row]")?.querySelector("[data-pack-main-result]");
  if(resultEl) resultEl.textContent=resultText;
  if(summaryResult) summaryResult.textContent=resultText;
  if(mainResult){
    mainResult.textContent=resultText;
  }
  schedulePackingDetailsSave();
});

async function savePackingPatch(id,patch){
  try{
    await ensureSupabaseReady();
  }catch(err){
    alert("Supabase is nog niet beschikbaar: "+err.message);
    return false;
  }

  const item=packingData.find(x=>x.id===id);
  if(!item) return false;
  const previous={...item};

  patch.updated_at=new Date().toISOString();
  patch.updated_by=actorName();
  Object.assign(item,patch);
  renderPacking();

  const {error}=await client.from("packing").update(patch).eq("id",id);
  if(error){
    Object.assign(item,previous);
    renderPacking();
    alert("Opslaan mislukt: "+error.message);
    return false;
  }
  return true;
}

async function setPackingStatus(id,status){
  await savePackingPatch(id,{status});
}

let packingModeItems=[];
let packingModeIndex=0;
let packingRecognition=null;
let packingRecognitionTimer=null;
let packingDictationTimer=null;
let packingDictationArmed=false;
let packingQuickPendingIds=[];
let packingQuickUndoIds=[];
let packingQuickLastIds=[];
let packingQuickQuantities=new Map();

function packingSpokenNumber(value){
  const raw=normalizePackingSearch(value).replace(/\s+/g," ").trim();
  const numeric=raw.match(/\d+(?:[,.]\d+)?/);
  if(numeric) return Math.max(0,Number(numeric[0].replace(",","."))||0);
  const direct={nul:0,een:1,eén:1,twee:2,drie:3,vier:4,vijf:5,zes:6,zeven:7,acht:8,negen:9,tien:10,elf:11,twaalf:12,dertien:13,veertien:14,vijftien:15,zestien:16,zeventien:17,achttien:18,negentien:19,twintig:20,dertig:30,veertig:40,vijftig:50,zestig:60,zeventig:70,tachtig:80,negentig:90,honderd:100};
  if(Object.prototype.hasOwnProperty.call(direct,raw)) return direct[raw];
  const compact=raw.replace(/\s+/g,"");
  const compound=compact.match(/^(een|eén|twee|drie|vier|vijf|zes|zeven|acht|negen)en(twintig|dertig|veertig|vijftig|zestig|zeventig|tachtig|negentig)$/);
  if(compound) return direct[compound[1]]+direct[compound[2]];
  return null;
}

function packingQuantityCommand(text){
  const normalized=normalizePackingSearch(text);
  const numberWords="(?:\\d+(?:[,.]\\d+)?|nul|een|eén|twee|drie|vier|vijf|zes|zeven|acht|negen|tien|elf|twaalf|dertien|veertien|vijftien|zestien|zeventien|achttien|negentien|twintig|dertig|veertig|vijftig|zestig|zeventig|tachtig|negentig|honderd|(?:een|eén|twee|drie|vier|vijf|zes|zeven|acht|negen)\\s*en\\s*(?:twintig|dertig|veertig|vijftig|zestig|zeventig|tachtig|negentig))";
  const patterns=[
    new RegExp(`\\b(?:aantal|hoeveelheid|totaal)\\s*(?:moet|wordt|is|naar)?\\s*(?:op)?\\s*(${numberWords})\\s*(?:zijn)?\\b`,"i"),
    new RegExp(`\\b(${numberWords})\\s*(?:stuks?|exemplaren?)\\b`,"i"),
    new RegExp(`^\\s*(${numberWords})\\s+`,"i")
  ];
  for(const pattern of patterns){
    const match=normalized.match(pattern);
    if(!match) continue;
    const quantity=packingSpokenNumber(match[1]);
    if(quantity===null) continue;
    return {quantity,cleaned:normalized.replace(match[0]," ").replace(/\s+/g," ").trim()};
  }
  return {quantity:null,cleaned:normalized};
}

function packingCommandQuery(text){
  return normalizePackingSearch(text)
    .replace(/\b(stop|correctie|corrigeer|herstel|sorry|nee|toch|maar|en|dan|zet|maak|doe|haal|artikel|item|die|dat|deze|terug|ongedaan|niet|moet|wordt|is|zijn|op|naar|aantal|hoeveelheid|totaal|stuks?|exemplaren?|check|checken|gecheckt|gedaan|klaar|gepakt|ingepakt|afgevinkt|afvinken)\b/g," ")
    .replace(/\b\d+(?:[,.]\d+)?\b/g," ")
    .replace(/[^\p{L}\p{N}\s]/gu," ")
    .replace(/\s+/g," ").trim();
}

function setPackingSpokenTotal(item,quantity){
  if(quantity===null || quantity===undefined) return;

function packingVoiceMatches(transcript,packedOnly=false){
  const query=normalizePackingSearch(transcript)
    .replace(/\b(is|zijn|staat|staan|heb|hebben|al|nu|klaar|ingepakt|afgevinkt|afvinken|check|checken|gecheckt|gedaan|af|gepakt|mee|erin|ingeladen)\b/g," ")
    .replace(/\s+/g," ").trim();
  if(!query) return [];
  const words=query.split(" ").filter(word=>word.length>1);
  return packingData.filter(item=>packedOnly ? item.status==="packed" : item.status!=="packed").map(item=>{
    const text=packingSearchText(item);
    const exact=text.includes(query);
    const score=words.filter(word=>text.includes(word)).length;
    return {item,score:exact?score+10:score};
  }).filter(match=>match.score>0).sort((a,b)=>b.score-a.score).filter((match,index,all)=>index<5 && match.score===all[0].score).map(match=>match.item);
}

async function showPackingVoiceChoices(matches,transcript){
