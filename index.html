    highlightsEl.innerHTML=selected.map((p,i)=>`
      <div class="route-highlight">
        <div class="route-highlight-num">${i+1}</div>
        <div>
          <b>${esc(p.name)}</b>
          <small>${esc(p.type)} · hemelsbreed ${p.distance.toFixed(1)} km van het hotel</small>
        </div>
      </div>`).join("");

    renderRouteMap(origin,selected,trip);

    const gUrl=googleRouteUrl(origin,selected);
    actions.innerHTML=`

  }catch(err){
    console.error(err);
    status.className="route-status error";
    status.textContent=err.message || "Routevoorstel kon niet worden gemaakt.";
  }
}

function getCurrentPositionPromise(options={}){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("GPS/locatie wordt op dit apparaat niet ondersteund."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      resolve,
      reject,
      {
        enableHighAccuracy:true,
        maximumAge:60000,
        timeout:20000,
        ...options
      }
    );
  });
}

function compactPlaceName(address, displayName){
  if(!address) return displayName || "";

  const locality =
    address.city ||
    address.town ||
    address.village ||
    address.municipality ||
    address.hamlet ||
    address.suburb ||
    address.county ||
    "";

  const region =
    address.state ||
    address.region ||
    "";

  const country = address.country || "";

  return [locality, region, country]
    .filter(Boolean)
    .filter((value,index,array)=>array.indexOf(value)===index)
    .join(", ");
}

async function reverseGeocodeLocation(lat,lon){
  const params=new URLSearchParams({
    format:"jsonv2",
    lat:String(lat),
    lon:String(lon),
    zoom:"16",
    addressdetails:"1",
    "accept-language":"nl"
  });

  const response=await fetch(
    "https://nominatim.openstreetmap.org/reverse?"+params.toString(),
    {
      headers:{
        "Accept":"application/json"
      }
    }
  );

  if(!response.ok){
    throw new Error("Plaatsnaam kon niet worden opgehaald.");
  }

  const result=await response.json();
  return compactPlaceName(result.address,result.display_name);
}

function encodeGpsMemoryLocation(lat,lon,label){
  const safeLabel=(label||`${lat.toFixed(5)}, ${lon.toFixed(5)}`).replace(/\|/g,"/");
  return `geo:${lat.toFixed(6)},${lon.toFixed(6)}|${safeLabel}`;
}

function displayMemoryLocation(value){
  if(!value) return "";

  if(value.startsWith("geo:")){
    const pipe=value.indexOf("|");
    if(pipe>=0) return value.slice(pipe+1);
    return value.replace(/^geo:/,"");
  }

  const known={
    "baiersbronn":"Baiersbronn",
    "zuid-tirol":"Zuid-Tirol",
    "balderschwang":"Balderschwang"
  };

  return known[value] || value;
}

function storageLocationSlug(value){
  if(!value) return "algemeen";
  if(value.startsWith("geo:")) return "gps";

  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9-]+/g,"-")
    .replace(/^-+|-+$/g,"") || "algemeen";
}

async function resolveMemoryLocation(){
  const mode=document.getElementById("memoryLocationMode").value;
  const status=document.getElementById("memoryLocationStatus");

  if(mode!=="auto"){
    status.className="memory-location-status";
    status.textContent=mode
      ? "Deze hotel-/reislocatie wordt gebruikt."
      : "Dit moment wordt zonder locatie opgeslagen.";
    return mode || null;
  }

  status.className="memory-location-status working";
  status.textContent="📍 Huidige locatie bepalen…";

  try{
    const position=await getCurrentPositionPromise();
    const lat=position.coords.latitude;
    const lon=position.coords.longitude;

    let label="";
    try{
      label=await reverseGeocodeLocation(lat,lon);
    }catch(reverseError){
      console.warn(reverseError);
      label=`${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    }

    const encoded=encodeGpsMemoryLocation(lat,lon,label);

    status.className="memory-location-status ok";
    status.textContent="✓ Locatie gevonden: "+label;

    return encoded;
  }catch(err){
    console.error(err);

    status.className="memory-location-status error";
    status.textContent="Locatie niet beschikbaar. Moment wordt zonder locatie opgeslagen.";

    return null;
  }
}

async function saveMemoryWithPhotos(){
  if(!client){
    alert("De app is nog niet verbonden met Supabase.");
    return;
  }

  const textValue=document.getElementById("memoryText").value.trim();
  const stop=await resolveMemoryLocation();
  const mood=document.getElementById("memoryMood").value || null;
  const files=[...(document.getElementById("memoryPhotos").files||[])];
  const msg=document.getElementById("memoryFormMsg");
  const button=document.getElementById("saveMemory");

  if(!textValue && !files.length){
    msg.innerHTML='<div class="notice">Voeg een tekst of minimaal één foto toe.</div>';
    return;
  }

  button.disabled=true;
  button.textContent="Opslaan…";
  msg.innerHTML='<div class="notice">Moment opslaan als <strong>'+esc(actorName())+'</strong>…</div>';

  try{
    const {data:memory,error:memoryError}=await client
      .from("memories")
      .insert({
        trip_id:currentTripId,
        stop_id:stop,
        mood:mood,
        text:textValue || "Foto-moment",
        created_by:actorName(),
        updated_at:new Date().toISOString()
      })
      .select()
      .single();

    if(memoryError) throw memoryError;

    let uploaded=0;

    for(const file of files){
      const extension=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"").toLowerCase() || "jpg";
      const safeStop=storageLocationSlug(stop);
      const fileName=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${extension}`;
      const storagePath=`${currentTripId}/${safeStop}/${memory.id}/${fileName}`;

      const {error:uploadError}=await client.storage
        .from("vakantie-media")
        .upload(storagePath,file,{
          contentType:file.type||"image/jpeg",
          upsert:false
        });

      if(uploadError){
        console.error(uploadError);
        continue;
      }

      const {error:photoInsertError}=await client
        .from("photos")
        .insert({
          memory_id:memory.id,
          trip_id:currentTripId,
          stop_id:stop,
          storage_path:storagePath,
          file_name:file.name,
          mime_type:file.type||null,
          created_by:actorName()
        });

      if(photoInsertError){
        console.error(photoInsertError);
        continue;
      }

      uploaded++;
    }

    document.getElementById("memoryText").value="";
    document.getElementById("memoryMood").value="";
    document.getElementById("memoryPhotos").value="";

    msg.innerHTML=
      '<div class="notice"><span class="ok">✓ Moment opgeslagen door '+
      esc(actorName())+
      (files.length ? ` · ${uploaded}/${files.length} foto${files.length===1?"":"\'s"} opgeslagen` : "")+
      '.</span></div>';

    await loadMemories();
  }catch(err){
    console.error(err);
    msg.innerHTML='<div class="notice"><span class="error">Opslaan mislukt: '+esc(err.message)+'</span></div>';
  }finally{
    button.disabled=false;
    button.textContent="Moment opslaan";
  }
}

  "baiersbronn":["Baiersbronn","Freudenstadt","Oppenau","Baden-Baden"],
  "zuid-tirol":["Völs am Schlern","Kastelruth","Seis am Schlern","Tiers am Rosengarten","Bozen"],
  "balderschwang":["Balderschwang","Obermaiselstein","Bolsterlang","Oberstdorf","Sonthofen"]
};

function fetchWithTimeout(url,options={},timeoutMs=10000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  return fetch(url,{...options,signal:controller.signal})
    .finally(()=>clearTimeout(timer));
}

function curatedIdeasFor(radius,mode="highlights"){
  const stop=liveTodayHotel?.stop || "baiersbronn";

  if(mode==="villages"){
    const names=CURATED_VILLAGE_IDEAS[stop]||[];
    return names.slice(0,radius===20?3:radius===30?4:5).map((name,i)=>({
      name,
      query:`${name}, ${liveTodayHotel?.country||""}`,
      type:"Dorp / plaats",
      minRadius:20,
      why:"Leuke plaats om even rond te kijken, koffie te drinken of lokaal sfeer te proeven.",
      stop:"30–75 min"
    }));
  }

  const all=CURATED_ROUTE_IDEAS[stop]||[];
  const eligible=all.filter(x=>x.minRadius<=radius);

  // Houd de rit gevarieerd en niet te vol.
  const count=radius===20?3:radius===30?4:5;
  return eligible.slice(0,count);
}

function mapsSearchUrl(query){
  return "https://www.google.com/maps/search/?"+new URLSearchParams({
    api:"1",
    query
  }).toString();
}

function googleRouteUrlByNames(ideas){
  const origin=liveTodayHotel?.address || liveTodayHotel?.city || "";
  const params=new URLSearchParams({
    api:"1",
    origin,
    destination:origin,
    travelmode:"driving"
  });
  if(ideas.length){
    params.set("waypoints",ideas.map(x=>x.query||x.name).join("|"));
  }
  return "https://www.google.com/maps/dir/?"+params.toString();
}

async function geocodeRouteQuery(query){
  const url="https://nominatim.openstreetmap.org/search?"+
    new URLSearchParams({
      q:query,
      format:"jsonv2",
      limit:"1",
      "accept-language":"nl"
    }).toString();

  const response=await fetchWithTimeout(url,{
    headers:{"Accept":"application/json"}
  },8000);

  if(!response.ok) throw new Error("Stop kon niet worden gegeocodeerd.");
  const data=await response.json();
  if(!data?.length) throw new Error("Stop niet gevonden.");

  return {
    name:query,
    lat:Number(data[0].lat),
    lon:Number(data[0].lon)
  };
}

function delay(ms){ return new Promise(resolve=>setTimeout(resolve,ms)); }

async function resolveRouteIdeas(ideas){
  const resolved=[];

  for(let i=0;i<ideas.length;i++){
    try{
      const p=await geocodeRouteQuery(ideas[i].query||ideas[i].name);
      resolved.push({...ideas[i],lat:p.lat,lon:p.lon});
    }catch(err){
      console.warn("Geocoding overgeslagen",ideas[i].name,err);
    }

    // Nominatim niet onnodig snel achter elkaar aanroepen.
    if(i<ideas.length-1) await delay(850);
  }

  return resolved;
}

async function robustOsrmRoundTrip(origin,stops){
  if(stops.length<2) throw new Error("Te weinig kaartpunten voor de ingebouwde route.");

  const coords=[origin,...stops]
    .map(p=>`${Number(p.lon).toFixed(6)},${Number(p.lat).toFixed(6)}`)
    .join(";");

  const params=new URLSearchParams({
    roundtrip:"true",
    source:"first",
    destination:"any",
    geometries:"geojson",
    overview:"full",
    steps:"false"
  });

  const response=await fetchWithTimeout(
    `https://router.project-osrm.org/trip/v1/driving/${coords}?${params.toString()}`,
    {},
    10000
  );

  if(!response.ok) throw new Error("Ingebouwde routeberekening niet beschikbaar.");
  const json=await response.json();
  if(json.code!=="Ok" || !json.trips?.length){
    throw new Error("Geen ingebouwde rondrit beschikbaar.");
  }
  return json;
}

function robustInitMapAtHotel(){
  return resolveHotelCoordinates(liveTodayHotel).then(coords=>{
    if(!document.getElementById("plannerRouteMap")) return null;

    destroyPlannerRouteMap();
    plannerRouteMap=L.map("plannerRouteMap",{zoomControl:true}).setView([coords.lat,coords.lon],11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }).addTo(plannerRouteMap);

    L.marker([coords.lat,coords.lon])
      .addTo(plannerRouteMap)
      .bindPopup(liveTodayHotel.hotel);

    setTimeout(()=>plannerRouteMap.invalidateSize(),100);

    return {lat:coords.lat,lon:coords.lon};
  });
}

async function generateHighlightRoute(mode="highlights"){
  const status=document.getElementById("routeStatus");
  const actions=document.getElementById("routeActions");
  const ideas=curatedIdeasFor(plannerRouteRadius,mode);

  if(!ideas.length){
    status.className="route-status error";
    status.textContent="Voor deze combinatie heb ik nog geen routevoorstel.";
    return;
  }

  // DIRECT resultaat tonen — nooit meer een leeg, hangend scherm.
  status.className="route-status";
  status.textContent=`Voorstel klaar: ${ideas.length} highlights geselecteerd. Ik probeer nu ook de route op de kaart te tekenen…`;
  renderCuratedSummary(ideas);
  renderCuratedIdeas(ideas);

  actions.innerHTML=`
    <a class="route-link" href="${esc(googleRouteUrlByNames(ideas))}" target="_blank" rel="noopener">
      Open complete rondrit in Google Maps ↗
    </a>
    <button class="route-link secondary" id="rerollRoute" type="button">Opnieuw berekenen</button>`;

  document.getElementById("rerollRoute").onclick=()=>generateHighlightRoute(mode);

  try{
    const origin=await robustInitMapAtHotel();
    if(!origin) throw new Error("Kaart niet beschikbaar.");

    const resolved=await resolveRouteIdeas(ideas);

    if(resolved.length<2){
      status.textContent=
        "De stops en Google Maps-route zijn klaar. De ingebouwde kaart kon niet genoeg stops lokaliseren, maar de externe route werkt wel.";
      return;
    }

    const trip=await robustOsrmRoundTrip(origin,resolved);
    const route=trip.trips[0];
    const km=route.distance/1000;
    const minutes=Math.round(route.duration/60);

    renderRouteMap(origin,resolved,trip);

    const summary=document.getElementById("routeSummary");
    summary.innerHTML=`
      <strong>${km.toFixed(0)} km · ca. ${Math.floor(minutes/60)}u ${String(minutes%60).padStart(2,"0")}m rijden</strong>
      <div class="muted-line">
        Rondrit vanaf ${esc(liveTodayHotel.hotel)} met ${resolved.length} kaartstops.
        Reken bovenop de rijtijd nog tijd voor koffie, foto's, wandelen en de highlights zelf.
      </div>
      <div class="route-method-note">
        ${ideas.length} aanbevolen stops · zoekstraal ${plannerRouteRadius} km.<br>
        🔋 ${esc(rangeAdviceForDistance(km).headline)} — ${esc(rangeAdviceForDistance(km).text)}
      </div>`;

    status.textContent="Klaar: highlights, leuke stops én de rondrit staan hieronder.";
  }catch(err){
    console.warn("Ingebouwde routefallback actief",err);
    status.textContent=
      "De highlights en Google Maps-rondrit zijn klaar. De route kon in deze lokale test niet volledig op de ingebouwde kaart worden getekend.";
  }
}

function renderRouteDetail(mode="highlights"){
  const title=mode==="villages"
    ? "Leuke dorpjes & stops in de omgeving"
    : "Mooie autorit langs highlights";

  const intro=mode==="villages"
    ? "Kies 20, 30 of 50 km. Je krijgt meteen leuke plaatsen en stops; daarna probeert de app er ook een rondrit van te tekenen."
    : "Kies 20, 30 of 50 km. Je krijgt meteen een inhoudelijk voorstel met highlights en leuke stops; daarna wordt de kaart-route berekend.";

  showPlannerDetail(title,intro,"ROUTEVOORSTEL · HIGHLIGHTS & LEUKE STOPS");

  const body=document.getElementById("plannerDetailBody");
  body.innerHTML=`
    <div class="route-controls">
      <span class="route-controls-label">Zoekstraal</span>
      ${[20,30,50].map(km=>`
        <button class="route-radius ${plannerRouteRadius===km?"active":""}" data-route-radius="${km}" type="button">${km} km</button>
      `).join("")}
      <button id="generateRoute" class="route-generate" type="button">Maak routevoorstel</button>
    </div>

    <div id="routeStatus" class="route-status">
      Kies een afstand en klik op Maak routevoorstel.
    </div>

    <div class="route-layout">
      <div>
        <div id="routeSummary" class="route-summary"></div>
        <div id="routeHighlights" class="route-highlights"></div>
        <div id="routeActions" class="route-actions"></div>
      </div>
      <div id="plannerRouteMap" class="route-map"></div>
    </div>`;

  body.querySelectorAll("[data-route-radius]").forEach(btn=>{
    btn.onclick=()=>{
      plannerRouteRadius=Number(btn.dataset.routeRadius);
      body.querySelectorAll("[data-route-radius]").forEach(b=>{
        b.classList.toggle("active",Number(b.dataset.routeRadius)===plannerRouteRadius);
      });

      // Meteen de inhoud laten wisselen zodat de gebruiker ziet wat 20/30/50 doet.
      const ideas=curatedIdeasFor(plannerRouteRadius,mode);
      renderCuratedSummary(ideas);
      renderCuratedIdeas(ideas);
      document.getElementById("routeStatus").textContent=
        `${ideas.length} interessante stops beschikbaar voor ${plannerRouteRadius} km. Klik op Maak routevoorstel voor de rondrit.`;
    };
  });

  document.getElementById("generateRoute").onclick=()=>generateHighlightRoute(mode);

  // Toon direct al voorstellen; geen lege linkerkolom meer.
  const initialIdeas=curatedIdeasFor(plannerRouteRadius,mode);
  renderCuratedSummary(initialIdeas);
  renderCuratedIdeas(initialIdeas);

  robustInitMapAtHotel().catch(err=>{
    console.warn(err);
    document.getElementById("routeStatus").textContent=
      "Highlights staan klaar. De kaart kon nog niet worden geladen; Google Maps blijft beschikbaar bij routegeneratie.";
  });
}

const ENV_CATEGORY_ORDER_KEY="vakantie_env_category_order_v1";

function validEnvironmentCategoryOrder(order){
  if(!Array.isArray(order)) return false;
  const valid=ENV_CATEGORY_DEFAULT_ORDER;
  return order.length===valid.length &&
    order.every(key=>valid.includes(key)) &&
    new Set(order).size===valid.length;
}

function environmentCategoryOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem(ENV_CATEGORY_ORDER_KEY)||"null");
    if(validEnvironmentCategoryOrder(saved)) return saved;
  }catch(err){
    console.warn("Omgeving-indeling kon niet worden gelezen.",err);
  }
  return [...ENV_CATEGORY_DEFAULT_ORDER];
}

function saveEnvironmentCategoryOrder(order){
  if(!validEnvironmentCategoryOrder(order)) return;
  localStorage.setItem(ENV_CATEGORY_ORDER_KEY,JSON.stringify(order));
}

function applyEnvironmentCategoryOrder(){
  const strip=document.getElementById("envCategoryStrip");
  if(!strip) return;

  const buttons=new Map(
    [...strip.querySelectorAll("[data-env-category]")]
      .map(btn=>[btn.dataset.envCategory,btn])
  );

  environmentCategoryOrder().forEach(key=>{
    const button=buttons.get(key);
    if(button) strip.appendChild(button);
  });
}

function moveEnvironmentCategoryToPosition(key,targetPosition){
  const order=environmentCategoryOrder();
  const oldIndex=order.indexOf(key);
  if(oldIndex<0) return;

  const newIndex=Math.max(0,Math.min(order.length-1,Number(targetPosition)-1));
  order.splice(oldIndex,1);
  order.splice(newIndex,0,key);

  saveEnvironmentCategoryOrder(order);
  applyEnvironmentCategoryOrder();
  renderEnvironmentLayoutRows();
}

function renderEnvironmentLayoutRows(){
  const host=document.getElementById("envLayoutRows");
  if(!host) return;

  const order=environmentCategoryOrder();

  host.innerHTML=order.map((key,index)=>{
    const cfg=ENV_CATEGORIES[key];
    const options=order.map((_,i)=>
      `<option value="${i+1}" ${i===index?"selected":""}>${i+1}</option>`
    ).join("");

    return `
      <div class="env-layout-row">
        <div class="env-layout-row-icon">${esc(cfg.icon)}</div>
        <div class="env-layout-row-label">${esc(cfg.label)}</div>
        <select
          class="env-layout-position"
          data-env-layout-key="${esc(key)}"
          aria-label="Positie van ${esc(cfg.label)}"
        >${options}</select>
      </div>`;
  }).join("");

  host.querySelectorAll("[data-env-layout-key]").forEach(select=>{
    select.onchange=()=>{
      moveEnvironmentCategoryToPosition(
        select.dataset.envLayoutKey,
        Number(select.value)
      );
    };
  });
}

function openEnvironmentLayoutEditor(){

  panel.scrollIntoView({behavior:"smooth",block:"nearest"});

function closeEnvironmentLayoutEditor(){

function environmentTypeLabel(tags={}){

  if(tags.amenity==="clinic") return "Kliniek";
  if(tags.amenity==="pharmacy") return "Apotheek";
  if(tags.amenity==="toilets") return "Openbaar toilet";
  if(tags.amenity==="atm") return "Pinautomaat";
  if(tags.amenity==="fuel") return "Tankstation";
  if(tags.tourism==="hotel" || tags.tourism==="guest_house") return "Hotel";
  if(tags.amenity==="parking") return "Parkeerplaats";
  if(tags.barrier==="toll_booth") return "Tolpunt";
  if(tags.leisure==="dog_park") return "Hondenpark";
  if(tags.dog==="yes" || tags.dogs==="yes") return "Hondvriendelijk";
  if(tags.amenity==="restaurant") return "Restaurant";
  if(tags.amenity==="cafe") return "Café";
  if(tags.shop==="bakery") return "Bakkerij";
  if(tags.amenity==="charging_station") return "Laadpunt";
  if(tags.tourism==="viewpoint") return "Uitzichtspunt";
  if(tags.tourism==="museum") return "Museum";
  if(tags.tourism==="attraction") return "Attractie";
  if(tags.historic==="castle") return "Kasteel";
  if(tags.historic==="ruins") return "Ruïne";
  if(tags.historic==="monument") return "Monument";
  if(tags.natural==="waterfall") return "Waterval";

function environmentAddress(tags={}){
  if(tags["addr:full"]) return tags["addr:full"];

  const street=[
    tags["addr:street"] || tags["addr:place"] || "",
    tags["addr:housenumber"] || ""
  ].filter(Boolean).join(" ");

  const city=[
    tags["addr:postcode"] || "",
    tags["addr:city"] || tags["addr:town"] || tags["addr:village"] || ""
  ].filter(Boolean).join(" ");

  return [street,city].filter(Boolean).join(", ");
}

function environmentExtra(tags={}){
  const bits=[];
  if(tags.opening_hours) bits.push("Openingstijden: "+tags.opening_hours);
  if(tags.phone) bits.push("Tel: "+tags.phone);
  if(tags["contact:phone"]) bits.push("Tel: "+tags["contact:phone"]);
  if(tags.socket_type2) bits.push("Type 2");
  if(tags.capacity) bits.push("Capaciteit: "+tags.capacity);
  if(tags.fee==="no") bits.push("Gratis");
  if(tags.dog==="yes" || tags.dogs==="yes") bits.push("Honden toegestaan");
  return bits.slice(0,2).join(" · ");
}

function environmentPlaceName(tags={},fallback="Plek"){
  return tags.name ||
         tags.brand ||
         tags.operator ||
         tags["name:nl"] ||
         tags["name:de"] ||
         tags["name:it"] ||
         fallback;
}

function environmentPointFromElement(el){
  if(el.type==="node" && Number.isFinite(el.lat) && Number.isFinite(el.lon)){
    return {lat:el.lat,lon:el.lon};
  }
  if(el.center && Number.isFinite(el.center.lat) && Number.isFinite(el.center.lon)){
    return {lat:el.center.lat,lon:el.center.lon};
  }
  return null;
}

async function envFetchWithTimeout(url,options={},timeoutMs=22000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort("timeout"),timeoutMs);

  try{
    return await fetch(url,{...options,signal:controller.signal});
  }catch(err){
    if(err?.name==="AbortError" || String(err?.message||"").toLowerCase().includes("aborted")){
      throw new Error("De live zoekdienst reageerde te langzaam.");
    }
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

async function fetchEnvironmentPlaces(lat,lon,radiusKm,categoryKey){
  const cfg=ENV_CATEGORIES[categoryKey];
  const metres=Math.round(radiusKm*1000);

  const body=cfg.queries
    .map(q=>`${q}(around:${metres},${lat},${lon});`)
    .join("\n");

  const query=`[out:json][timeout:30];(${body});out center tags;`;

  const endpoints=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.nchc.org.tw/api/interpreter"
  ];

  let lastError=null;

  for(let i=0;i<endpoints.length;i++){
    const endpoint=endpoints[i];

    try{
      const response=await envFetchWithTimeout(
        endpoint,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8",
            "Accept":"application/json"
          },
          body:"data="+encodeURIComponent(query)
        },
        22000 + (i*4000)
      );

      if(!response.ok){
        throw new Error(`Live zoekdienst gaf status ${response.status}.`);
      }

      const json=await response.json();
      const origin={lat:Number(lat),lon:Number(lon)};
      const seen=new Set();

      const places=(json.elements||[])
        .map(el=>{
          const point=environmentPointFromElement(el);
          if(!point) return null;

          const tags=el.tags||{};
          const name=environmentPlaceName(tags,cfg.fallback);
          const key=[
            name.toLowerCase(),
            point.lat.toFixed(5),
            point.lon.toFixed(5)
          ].join("|");

          if(seen.has(key)) return null;
          seen.add(key);

          return {
            id:`${el.type}-${el.id}`,
            name,
            lat:point.lat,
            lon:point.lon,
            tags,
            type:environmentTypeLabel(tags),
            address:environmentAddress(tags),
            extra:environmentExtra(tags),
            distance:haversineKm(origin,point)
          };
        })
        .filter(Boolean)
        .filter(p=>p.distance<=radiusKm+0.3)
        .sort((a,b)=>a.distance-b.distance)
        .slice(0,80);

      if(places.length){
        return places;
      }

      // A successful empty result is valid; no need to hammer more endpoints.
      return [];
    }catch(err){
      lastError=err;
      console.warn("Omgeving endpoint mislukt",endpoint,err);
    }
  }

  // Limited fallback through Nominatim for the most useful everyday categories.
  try{
    const fallbackPlaces=await fetchEnvironmentNominatimFallback(
      lat,lon,radiusKm,categoryKey
    );
    if(fallbackPlaces.length) return fallbackPlaces;
  }catch(err){
    console.warn("Nominatim fallback mislukt",err);
  }

  throw lastError || new Error("Live plekken konden niet worden opgehaald.");
}


const ENV_NOMINATIM_SEARCH = {
  fast_food:["fast food","Imbiss"],
  supermarket:["supermarket"],
  doctors:["doctor","general practitioner"],
  hospital:["hospital"],
  pharmacy:["pharmacy"],
  toilets:["public toilet"],
  atm:["ATM"],
  fuel:["fuel station"],
  restaurant:["restaurant"],
  cafe:["cafe"],
  bakery:["bakery"],
  charging:["EV charging station"],
  attractions:["tourist attraction","viewpoint"],
  dogs:["dog park"]
};

async function fetchEnvironmentNominatimFallback(lat,lon,radiusKm,categoryKey){
  const terms=ENV_NOMINATIM_SEARCH[categoryKey];
  if(!terms?.length) return [];

  // Viewbox is only a search hint; exact filtering still happens on distance.
  const delta=Math.max(.08,radiusKm/85);
  const left=lon-delta;
  const right=lon+delta;
  const top=lat+delta;
  const bottom=lat-delta;
  const origin={lat:Number(lat),lon:Number(lon)};
  const all=[];
  const seen=new Set();

  for(const term of terms.slice(0,2)){
    try{
      const params=new URLSearchParams({
        q:term,
        format:"jsonv2",
        limit:"18",
        addressdetails:"1",
        bounded:"1",
        viewbox:`${left},${top},${right},${bottom}`,
        "accept-language":"nl"
      });

      const response=await envFetchWithTimeout(
        "https://nominatim.openstreetmap.org/search?"+params.toString(),
        {headers:{"Accept":"application/json"}},
        10000
      );

      if(!response.ok) continue;
      const rows=await response.json();

      for(const row of rows||[]){
        const p={lat:Number(row.lat),lon:Number(row.lon)};
        if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon)) continue;

        const distance=haversineKm(origin,p);
        if(distance>radiusKm+0.3) continue;

        const name=(row.display_name||term).split(",")[0].trim();
        const key=`${name.toLowerCase()}|${p.lat.toFixed(5)}|${p.lon.toFixed(5)}`;
        if(seen.has(key)) continue;
        seen.add(key);

        all.push({
          id:`nominatim-${row.place_id}`,
          name,
          lat:p.lat,
          lon:p.lon,
          tags:{},
          type:ENV_CATEGORIES[categoryKey]?.fallback || "Plek",
          address:row.display_name||"",
          extra:"Reservezoekresultaat via OpenStreetMap",
          distance
        });
      }
    }catch(err){
      console.warn("Nominatim term mislukt",term,err);
    }
  }

  return all.sort((a,b)=>a.distance-b.distance).slice(0,30);
}

function renderEnvironmentPlaces(places){
  const cfg=envCategoryConfig();
  const list=document.getElementById("envResultsList");
  const meta=document.getElementById("envResultsMeta");
  const mapStatus=document.getElementById("envMapStatus");

  document.getElementById("envCategoryIcon").textContent=cfg.icon;
  document.getElementById("envCategoryTitle").textContent=cfg.label;

  envPlaceLayer?.clearLayers();

  if(!places.length){
    meta.textContent=`Geen ${cfg.label.toLowerCase()} gevonden binnen ${envRadius} km.`;
    list.innerHTML=`
      <div class="env-empty">
        Geen live resultaten gevonden.<br>
        Kies een grotere straal of een andere categorie.
      </div>`;
    mapStatus.textContent="0 plekken";
    return;
  }

  meta.textContent=
    `${places.length} live plek${places.length===1?"":"ken"} · dichtstbij eerst · max. ${envRadius} km`;

  list.innerHTML=places.map((place,index)=>{
    const address=place.address
      ? `<div class="env-place-address">${esc(place.address)}</div>`
      : "";

    const extra=place.extra
      ? `<div class="env-place-extra">${esc(place.extra)}</div>`
      : "";

    return `<article class="env-place-card">
      <div class="env-place-top">
        <div>
          <div class="env-place-name">${esc(place.name)}</div>
          <div class="env-place-type">${esc(place.type)}</div>
        </div>
        <span class="env-distance">${place.distance<1
          ? Math.round(place.distance*1000)+" m"
          : place.distance.toFixed(1)+" km"}</span>
      </div>
      ${address}
      ${extra}
      <div class="env-place-actions">
        <button class="env-route-btn" type="button" data-env-route-index="${index}">Route ↗</button>
        ${envCategory==="charging"
          ? `<button class="env-route-btn" type="button" data-env-charge-index="${index}">⚡ Laadbeurt</button>`
          : ""}
        <a class="env-map-link" href="${esc(envGoogleMapUrl(place))}" target="_blank" rel="noopener">Google Maps</a>
      </div>
    </article>`;
  }).join("");

  list.querySelectorAll("[data-env-route-index]").forEach(btn=>{
    btn.onclick=()=>envRouteTo(places[Number(btn.dataset.envRouteIndex)]);
  });

  list.querySelectorAll("[data-env-charge-index]").forEach(btn=>{
    btn.onclick=()=>{
      const place=places[Number(btn.dataset.envChargeIndex)];
      showView("kosten");
      setTimeout(()=>openChargeSession(place),80);
    };
  });

  places.forEach(place=>{
    L.marker(
      [place.lat,place.lon],
      {icon:envMarkerIcon(cfg.icon)}
    )
      .addTo(envPlaceLayer)
      .bindPopup(
        `<strong>${esc(place.name)}</strong><br>`+
        `${esc(place.type)} · ${place.distance.toFixed(1)} km`+
        (place.address?`<br>${esc(place.address)}`:"")
      );
  });

  const bounds=L.latLngBounds(
    [[envHotelCoords.lat,envHotelCoords.lon],...places.slice(0,30).map(p=>[p.lat,p.lon])]
  );

  if(bounds.isValid()){
    envMap.fitBounds(bounds,{padding:[24,24],maxZoom:12});
  }

  mapStatus.classList.remove("error");
  mapStatus.textContent=`${places.length} plekken`;
}

async function loadEnvironmentPlaces(){
  const token=++envLoadToken;
  const cfg=envCategoryConfig();

  document.getElementById("envCategoryIcon").textContent=cfg.icon;
  document.getElementById("envCategoryTitle").textContent=cfg.label;
  document.getElementById("envResultsMeta").textContent=
    `Live ${cfg.label.toLowerCase()} ophalen…`;
  document.getElementById("envResultsList").innerHTML=
    '<div class="env-empty">Live plekken zoeken…</div>';

  const mapStatus=document.getElementById("envMapStatus");
  mapStatus.classList.remove("error");
  mapStatus.textContent="Zoeken…";

  try{
    const coords=await ensureEnvironmentHotel();
    await initEnvironmentMap();

    const places=await fetchEnvironmentPlaces(
      coords.lat,
      coords.lon,
      envRadius,
      envCategory
    );

    if(token!==envLoadToken) return;
    renderEnvironmentPlaces(places);
  }catch(err){
    if(token!==envLoadToken) return;

    console.error(err);

    document.getElementById("envResultsMeta").textContent=
      "De publieke live zoekdienst reageert tijdelijk niet.";

    const friendlyMessage=
      String(err?.message||"").toLowerCase().includes("langzaam")
        ? "De kaart werkt, maar de externe plekkenzoeker reageerde te langzaam."
        : "De kaart werkt, maar de externe plekkenzoeker is op dit moment niet bereikbaar.";

    document.getElementById("envResultsList").innerHTML=`
      <div class="env-retry-box">
        <strong>Live zoeken lukte nu niet</strong>
        ${esc(friendlyMessage)}
        <div class="env-retry-actions">
          <button id="envRetrySearch" type="button">Opnieuw proberen</button>
          <a href="${esc(environmentGoogleCategoryUrl())}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        </div>
      </div>`;

    document.getElementById("envRetrySearch")?.addEventListener("click",loadEnvironmentPlaces);

    mapStatus.classList.add("error");
    mapStatus.textContent="Live zoeken tijdelijk niet beschikbaar";
  }
}

    }
  });

  await loadEnvironmentPlaces();
}

  document.getElementById("calculateNextLeg")?.addEventListener("click",()=>calculateNextLegRange(true));

  const rangeCard=document.getElementById("rangeCard");
  if(rangeCard){
    const openRange=()=>{
      showView("reizen");
      setTimeout(()=>document.querySelector(".range-manager-card")?.scrollIntoView({behavior:"smooth",block:"center"}),80);
    };
    rangeCard.addEventListener("click",openRange);
    rangeCard.addEventListener("keydown",e=>{
      if(e.key==="Enter" || e.key===" "){e.preventDefault();openRange()}
    });
  }

  // Hotels is now a separate overview; Reis beheren is its own tab.
  document.querySelectorAll('.nav button[data-view="hotels"]').forEach(btn=>{
    btn.addEventListener("click",()=>setTimeout(renderHotelsTab,30));
  });
  document.querySelectorAll('.nav button[data-view="reizen"]').forEach(btn=>{
    btn.addEventListener("click",()=>setTimeout(renderTripManager,30));
  });
})();

/* ===== v53: mobiele navigatie, pas koppelen nadat de knoppen in de DOM staan ===== */
function setupMobileNavigation(){
  const isMobile=()=>window.matchMedia("(max-width:620px)").matches;
  const nav=document.getElementById("mobileAppNav");
  const sheet=document.getElementById("mobileMoreSheet");
  const moreBtn=document.getElementById("mobileMoreBtn");

  function markMobileActive(view){
    if(!nav) return;
    nav.querySelectorAll("[data-mobile-view]").forEach(btn=>{
      btn.classList.toggle("active",btn.dataset.mobileView===view);
    });
    const moreViews=["hotels","kosten","meenemen","reizen","technisch"];
    moreBtn?.classList.toggle("active",moreViews.includes(view));
  }

  function openMobileView(view){
    sheet.hidden=true;
    showView(view);
    markMobileActive(view);
    window.scrollTo({top:0,behavior:"smooth"});
  }

  document.querySelectorAll("[data-mobile-view]").forEach(btn=>{
    btn.addEventListener("click",()=>openMobileView(btn.dataset.mobileView));
  });

  moreBtn?.addEventListener("click",()=>{sheet.hidden=false});
  document.getElementById("mobileMoreClose")?.addEventListener("click",()=>{sheet.hidden=true});
  sheet?.querySelector(".mobile-more-backdrop")?.addEventListener("click",()=>{sheet.hidden=true});

  document.querySelectorAll(".legacy-nav [data-view]").forEach(btn=>{
    btn.addEventListener("click",()=>markMobileActive(btn.dataset.view));
  });

  if(isMobile()){
    const active=document.querySelector(".view.active")?.id || "reis";
    markMobileActive(active);
  }

  window.addEventListener("resize",()=>{
    if(!isMobile()) sheet.hidden=true;
  });
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",setupMobileNavigation,{once:true});
}else{
  setupMobileNavigation();
}

</script>
