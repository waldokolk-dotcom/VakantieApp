async function startPackingVoice(){
  const result=document.getElementById("packingVoiceResult");
  const button=document.getElementById("packingVoiceStart");
  const input=document.getElementById("packingQuickInput");
  if(packingIsIOS()){
    input.value="";
    armPackingKeyboardFallback("Tik nu op 🎤 in het iPhone-toetsenbord en spreek. De app verwerkt de tekst daarna vanzelf.");
    return;
  }
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    armPackingKeyboardFallback();
    return;
  }
  if(packingRecognition){
    packingRecognition.abort();
    return;
  }
  try{
    input.value="";
    packingRecognition=new SpeechRecognition();
    packingRecognition.lang="nl-NL";
    packingRecognition.interimResults=true;
    packingRecognition.continuous=false;
    packingRecognition.onresult=event=>{
      input.value=Array.from(event.results).map(entry=>entry[0]?.transcript||"").join(" ").trim();
      result.textContent=input.value ? `Ik hoor: “${input.value}”` : "Ik luister…";
    };
    packingRecognition.onerror=event=>{
      const message=event.error==="not-allowed"
        ? "Microfoon geblokkeerd. Gebruik nu de 🎤 van het toetsenbord; de app verwerkt je tekst vanzelf."
        : "Ik kon je niet verstaan. Gebruik de 🎤 van het toetsenbord of tik opnieuw op Spreek.";
      armPackingKeyboardFallback(message);
    };
    packingRecognition.onend=async()=>{
      clearTimeout(packingRecognitionTimer);
      packingRecognitionTimer=null;
      packingRecognition=null;
      resetPackingRecordingUI();
      if(input.value.trim()) await findPackingQuick();
    };
    button.classList.add("recording");
    button.textContent="🔴 Luistert…";
    result.textContent="Spreek nu. Zeg aan het einde ‘klaar’.";
    document.getElementById("packingVoiceChoices").innerHTML="";
    packingRecognition.start();
    packingRecognitionTimer=setTimeout(()=>packingRecognition?.stop?.(),10000);
  }catch(error){
    packingRecognition=null;
    resetPackingRecordingUI();
    armPackingKeyboardFallback("De microfoon kon niet starten. Gebruik nu de 🎤 van het toetsenbord; de app verwerkt je tekst vanzelf.");
  }
}

async function findPackingQuick(){
  const input=document.getElementById("packingQuickInput");
  packingDictationArmed=false;
  clearTimeout(packingDictationTimer);
  packingDictationTimer=null;
  const spoken=input.value.trim();
  const result=document.getElementById("packingVoiceResult");
  const choices=document.getElementById("packingVoiceChoices");
  const packAll=document.getElementById("packingQuickPackAll");
  const undoAll=document.getElementById("packingQuickUndoAll");
  packingQuickPendingIds=[];
  packingQuickUndoIds=[];
  packingQuickQuantities=new Map();
  choices.innerHTML="";
  packAll.hidden=true;
  undoAll.disabled=true;
  if(!spoken){
    result.textContent="Spreek of typ eerst één of meer namen.";
    input.focus();
    return;
  }

  const normalizedCommand=normalizePackingSearch(spoken);
  const quantityCommand=packingQuantityCommand(spoken);
  const isUndo=/\b(zet|maak|doe|haal)\b.*\b(terug|ongedaan)\b|\b(niet gepakt|toch niet|vinkje weg)\b/.test(normalizedCommand);
  const isCorrection=/\b(correctie|corrigeer|herstel|sorry|nee)\b/.test(normalizedCommand) || (/\baantal\b/.test(normalizedCommand) && /\b(moet|wordt|naar)\b/.test(normalizedCommand));
  const isComplete=/\b(check|checken|gecheckt|gedaan|klaar|gepakt|ingepakt|afgevinkt|afvinken)\b/.test(normalizedCommand);
  const commandQuery=packingCommandQuery(quantityCommand.cleaned);

  if(isUndo){
    const matches=commandQuery ? packingVoiceMatches(commandQuery,true) : packingData.filter(item=>packingQuickLastIds.includes(String(item.id)) && item.status==="packed");
    if(!matches.length){
      result.textContent="Ik weet niet welk ingepakt artikel je wilt terugzetten. Noem bijvoorbeeld: zet autosleutels terug.";
      return;
    }
    packingQuickLastIds=matches.map(item=>String(item.id));
    await updateQuickMatches(packingQuickLastIds,"todo");
    input.value="";
    return;
  }

  if(isCorrection && quantityCommand.quantity!==null){
    const matches=commandQuery ? [...packingVoiceMatches(commandQuery,false),...packingVoiceMatches(commandQuery,true)] : packingData.filter(item=>packingQuickLastIds.includes(String(item.id)));
    const unique=[...new Map(matches.map(item=>[String(item.id),item])).values()];
    if(!unique.length){
      result.textContent="Ik weet niet bij welk artikel dit aantal hoort. Zeg bijvoorbeeld: correctie autosleutels aantal twee.";
      return;
    }
    const quantities=new Map(unique.map(item=>[String(item.id),quantityCommand.quantity]));
    packingQuickLastIds=unique.map(item=>String(item.id));
    const saved=await updateQuickMatches(packingQuickLastIds,null,quantities);
    if(saved) result.textContent=`✓ Correctie opgeslagen: ${unique.map(item=>item.name).join(", ")} — totaal ${quantityCommand.quantity}.`;
    input.value="";
    return;
  }

  const normalizedSpoken=normalizePackingSearch(quantityCommand.cleaned);
  const foundOpen=new Map();
  const foundPacked=new Map();
  packingData.forEach(item=>{
    const name=normalizePackingSearch(item.name);
    if(name.length>=3 && normalizedSpoken.includes(name)){
      (item.status==="packed"?foundPacked:foundOpen).set(String(item.id),item);
    }
  });
  spoken.split(/[,;.]+|\s+en\s+|\s+plus\s+|\s+ook\s+/i).map(part=>part.trim()).filter(Boolean).forEach(part=>{
    const clause=packingQuantityCommand(part);
    const query=packingCommandQuery(clause.cleaned)||clause.cleaned;
    packingVoiceMatches(query,false).forEach(item=>{ foundOpen.set(String(item.id),item); if(clause.quantity!==null) packingQuickQuantities.set(String(item.id),clause.quantity); });
    packingVoiceMatches(query,true).forEach(item=>{ foundPacked.set(String(item.id),item); if(clause.quantity!==null) packingQuickQuantities.set(String(item.id),clause.quantity); });
  });
  if(!foundOpen.size && !foundPacked.size){
    packingVoiceMatches(spoken,false).forEach(item=>foundOpen.set(String(item.id),item));
    packingVoiceMatches(spoken,true).forEach(item=>foundPacked.set(String(item.id),item));
  }

  const openMatches=[...foundOpen.values()];
  const packedMatches=[...foundPacked.values()];
  if(!openMatches.length && !packedMatches.length){
    result.textContent=`Geen open items gevonden voor “${spoken}”. Probeer de namen iets korter uit te spreken.`;
    return;
  }
  packingQuickPendingIds=openMatches.map(item=>String(item.id));
  packingQuickUndoIds=packedMatches.map(item=>String(item.id));
  packingQuickLastIds=[...packingQuickPendingIds,...packingQuickUndoIds];

  if(isComplete && openMatches.length){
    const saved=await updateQuickMatches(packingQuickPendingIds,"packed",packingQuickQuantities);
    if(saved) result.textContent=`✓ ${openMatches.map(item=>item.name).join(", ")} ${openMatches.length===1?"is":"zijn"} ingepakt${packingQuickQuantities.size?"; het genoemde aantal is opgeslagen":""}.`;
    input.value="";
    return;
  }
  result.textContent=`${openMatches.length+packedMatches.length} ${(openMatches.length+packedMatches.length)===1?"item gevonden":"items gevonden"}. Tik op één item of gebruik een knop voor meerdere tegelijk.`;
  choices.innerHTML=[
    ...openMatches.map(item=>`<button class="btn secondary" type="button" data-quick-item-id="${esc(item.id)}" data-quick-status="packed"${packingQuickQuantities.has(String(item.id))?` data-quick-quantity="${packingQuickQuantities.get(String(item.id))}"`:""}>✓ ${esc(item.name)} afvinken${packingQuickQuantities.has(String(item.id))?` · aantal ${packingQuickQuantities.get(String(item.id))}`:""}</button>`),
    ...packedMatches.map(item=>`<button class="btn secondary" type="button" data-quick-item-id="${esc(item.id)}" data-quick-status="todo">↶ ${esc(item.name)} ongedaan</button>`)
  ].join("");
  packAll.hidden=!openMatches.length;
  undoAll.disabled=!packedMatches.length;
  input.value="";
}

async function updateQuickMatches(ids,status,quantities=new Map()){
  if(!ids.length) return;
  const result=document.getElementById("packingVoiceResult");
  const selected=packingData.filter(item=>ids.includes(String(item.id)));
  const previous=selected.map(item=>({item,status:item.status,updated_at:item.updated_at,updated_by:item.updated_by}));
  const patch=status ? {status,updated_at:new Date().toISOString(),updated_by:actorName()} : null;
  try{
    await ensureSupabaseReady();
    selected.forEach(item=>{
      if(patch) Object.assign(item,patch);
      if(quantities.has(String(item.id))) setPackingSpokenTotal(item,quantities.get(String(item.id)));
    });
    renderPacking();
    if(patch){
      const {error}=await client.from("packing").update(patch).in("id",selected.map(item=>item.id));
      if(error) throw error;
    }
    if(quantities.size){
      try{
        await persistPackingDetails();
      }catch(error){
        result.textContent="De status is opgeslagen, maar het aantal nog niet. Probeer de aantalsopdracht nog één keer.";
        console.error(error);
        return false;
      }
    }
    result.textContent=status==="packed" ? `✓ ${selected.length} ${selected.length===1?"item is":"items zijn"} afgevinkt.` : status==="todo" ? `↶ ${selected.length} ${selected.length===1?"item is":"items zijn"} teruggezet naar Nog doen.` : `✓ Aantal opgeslagen.`;
    packingQuickPendingIds=[];
    packingQuickUndoIds=[];
    document.getElementById("packingVoiceChoices").innerHTML="";
    document.getElementById("packingQuickPackAll").hidden=true;
    document.getElementById("packingQuickUndoAll").disabled=true;
    packingModeBuildItems();
    renderPackingMode();
    return true;
  }catch(error){
    previous.forEach(old=>Object.assign(old.item,{status:old.status,updated_at:old.updated_at,updated_by:old.updated_by}));
    renderPacking();
    result.textContent="Opslaan lukte niet. Probeer het nog een keer.";
    return false;
  }
}

function updateSavedCostCategoryOptions(){
  const standard=new Set(["hotel","restaurant","groceries","charging","parking","toll","activity","dogs","other"]);
  const saved=[...new Set(
    costData
      .map(row=>String(row.category||"").trim())
      .filter(category=>category && category!=="fuel" && !category.startsWith("__") && !standard.has(category))
  )].sort((a,b)=>a.localeCompare(b,"nl"));

  ["cCategory","receiptCategory"].forEach(id=>{
    const select=document.getElementById(id);
    if(!select) return;
    const current=select.value;
    select.querySelectorAll('option[data-saved-custom="true"]').forEach(option=>option.remove());
    const addOption=[...select.options].find(option=>option.value==="__custom__");
    saved.forEach(category=>{
      const option=document.createElement("option");
      option.value=category;
      option.textContent=category;
      option.dataset.savedCustom="true";
      select.insertBefore(option,addOption||null);
    });
    if([...select.options].some(option=>option.value===current)) select.value=current;
  });
}

let pendingChargeStation=null;

function chargingStationLabel(place){
  const tags=place?.tags||{};
  return tags.operator || tags.brand || tags.network || place?.name || "Laadstation";
}

function chargingStationPower(tags={}){
  const values=[];
  for(const [key,value] of Object.entries(tags)){
    if(key.includes(":output") && value){
      const match=String(value).match(/([\d.,]+)\s*kW/i);
      if(match) values.push(Number(match[1].replace(",",".")));
    }
  }
  if(tags.capacity) return values.length ? `${Math.max(...values)} kW · ${tags.capacity} aansluitingen` : `${tags.capacity} aansluitingen`;
  return values.length ? `${Math.max(...values)} kW` : "";
}

function setPendingChargeStation(place,source="gps"){
  pendingChargeStation=place || null;

  const name=document.getElementById("chargeStationName");
  const meta=document.getElementById("chargeStationMeta");

  if(!place){
    name.textContent="Locatie nog niet bepaald";
    meta.textContent="Gebruik automatische herkenning of kies een laadstation vanuit Omgeving.";
    return;
  }

  const label=chargingStationLabel(place);
  const details=[
    place.address || "",
    Number.isFinite(place.distance) ? `${place.distance<1?Math.round(place.distance*1000)+" m":place.distance.toFixed(1)+" km"} vanaf huidige locatie` : "",
    chargingStationPower(place.tags)
  ].filter(Boolean).join(" · ");

  name.textContent=label;
  meta.textContent=details || "Laadstation herkend.";

  document.querySelectorAll("[data-charge-choice]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.chargeChoice===String(place.id));
  });
}

async function detectNearbyChargingStations(){
  const choices=document.getElementById("chargeStationChoices");
  const name=document.getElementById("chargeStationName");
  const meta=document.getElementById("chargeStationMeta");

  name.textContent="Locatie bepalen…";
  meta.textContent="GPS gebruiken en laadstations in de directe omgeving zoeken.";
  choices.innerHTML="";

  try{
    const pos=await getCurrentPositionPromise({
      enableHighAccuracy:true,
      timeout:12000,
      maximumAge:60000
    });

    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    let places=[];
    try{
      places=await fetchEnvironmentPlaces(lat,lon,2,"charging");
    }catch(err){
      console.warn("Laadstations live zoeken mislukt:",err);
    }

    if(places.length){
      const nearest=places.slice(0,5);
      setPendingChargeStation(nearest[0]);

      choices.innerHTML=nearest.map(place=>`
        <button class="charge-station-choice ${place.id===nearest[0].id?"active":""}"
          type="button" data-charge-choice="${esc(String(place.id))}">
          <span>
            <strong>${esc(chargingStationLabel(place))}</strong><br>
            <small>${esc(place.address||place.type||"Laadstation")}</small>
          </span>
          <small>${place.distance<1?Math.round(place.distance*1000)+" m":place.distance.toFixed(1)+" km"}</small>
        </button>`).join("");

      choices.querySelectorAll("[data-charge-choice]").forEach(btn=>{
        btn.onclick=()=>{
          const found=nearest.find(p=>String(p.id)===btn.dataset.chargeChoice);
          if(found) setPendingChargeStation(found);
        };
      });

      return;
    }

    // No charger record found: still recognise the current place.
    const label=await reverseGeocodeLocation(lat,lon);
    setPendingChargeStation({
      id:"gps-"+Date.now(),
      name:"Laadlocatie",
      lat,lon,
      address:label,
      tags:{},
      distance:0
    });
    meta.textContent=`Geen specifiek laadstation gevonden; huidige locatie: ${label}`;
  }catch(err){
    console.error(err);
    name.textContent="Locatie niet beschikbaar";
    meta.textContent="Kies eventueel een laadstation via Omgeving of vul de laadbeurt zonder automatische locatie in.";
  }
}

  const amount=Number(amountRaw);
  const kwh=Number(kwhRaw);

  if(amount>0 && kwh>0){
    const unit=amount/kwh;
    box.textContent=`${kwh.toLocaleString("nl-NL",{maximumFractionDigits:2})} kWh · ${amount.toLocaleString("nl-NL",{style:"currency",currency:"EUR"})} · gemiddeld ${unit.toLocaleString("nl-NL",{style:"currency",currency:"EUR",minimumFractionDigits:3,maximumFractionDigits:3})}/kWh`;
  }else{
    box.textContent="Vul kosten en kWh in; de prijs per kWh wordt automatisch berekend.";

}

  ].filter(Boolean).join(" · ");

  const record={

  const {error}=await client.from("costs").insert(record);

function renderCosts(){
  // Aanbetalingen zijn uitsluitend vooruitbetaalde hotelkosten. Overige
  // uitgaven blijven volledig onderdeel van het oplopende vakantietotaal.
  const deposits=costData
    .filter(row=>isDepositCost(row) && String(row.category||"").toLowerCase()==="hotel")
    .reduce((s,x)=>s+(Number(x.amount_cents)||0),0);
  const total=costData
    .filter(row=>!isDepositCost(row))
    .reduce((s,x)=>s+(Number(x.amount_cents)||0),0);
  const chargingRows=costData.filter(x=>x.category==="charging" && !isDepositCost(x));
  const chargingEnergy=chargingRows.reduce((s,x)=>s+(Number(x.kwh)||0),0);

  document.getElementById("totalCosts").textContent=euro(total);
  document.getElementById("depositCosts").textContent="Al aanbetaald (los, niet in totaal): "+euro(deposits);
  document.getElementById("costCount").textContent=costData.filter(row=>!isDepositCost(row)).length;
  document.getElementById("kpiCosts").textContent=euro(total);

  const categoryLabels={
    hotel:"Hotels",
    restaurant:"Restaurants",
    groceries:"Boodschappen",
    charging:"Laden",
    parking:"Parkeren",
    toll:"Tol",
    activity:"Activiteiten",
    dogs:"Honden",
    other:"Overig"
  };
  const categoryOrder=["hotel","restaurant","groceries","charging","parking","toll","activity","dogs","other"];
  const categoryTotals=costData
    .filter(row=>!isDepositCost(row))
    .reduce((totals,row)=>{
      const category=String(row.category||"other").trim() || "other";
      totals[category]=(totals[category]||0)+(Number(row.amount_cents)||0);
      return totals;
    },{});
  const categoryTotalsEl=document.getElementById("costCategoryTotals");
  const customCategories=Object.keys(categoryTotals)
    .filter(category=>category!=="fuel" && !categoryOrder.includes(category))
    .sort((a,b)=>(categoryLabels[a]||a).localeCompare(categoryLabels[b]||b,"nl"));
  categoryTotalsEl.innerHTML=[...categoryOrder,...customCategories]
    .map(category=>[category,categoryTotals[category]||0])
    .map(([category,amount])=>
      `<div class="cost-category-total"><span>${esc(categoryLabels[category]||category)}</span><b>${euro(amount)}</b>${category==="charging" ? `<small>${chargingEnergy.toLocaleString("nl-NL",{maximumFractionDigits:1})} kWh</small>` : ""}</div>`
    ).join("");

  updateHotelCostCards();

  const el=document.getElementById("costList");
  updateCostFilterBanner();

  const visibleCosts=activeCostStopFilter
    ? costData.filter(row=>row.stop_id===activeCostStopFilter && !isDepositCost(row))
    : costData.filter(row=>!isDepositCost(row));

  if(!visibleCosts.length){
    el.innerHTML=activeCostStopFilter
      ? '<div class="empty">Nog geen kosten voor dit hotel.</div>'
      : '<div class="empty">Nog geen kosten.</div>';
    return;
  }

  el.innerHTML=visibleCosts.map(row=>{
    const charging=row.category==="charging";
    const deposit=isDepositCost(row);
    const kwh=Number(row.kwh)||0;
    const unit=charging && kwh>0 ? (Number(row.amount_cents||0)/100)/kwh : 0;

    const chargeMeta=charging
      ? `<div class="cost-charge-meta">
          ${kwh ? `${kwh.toLocaleString("nl-NL",{maximumFractionDigits:2})} kWh` : ""}
          ${kwh && unit ? ` · ${unit.toLocaleString("nl-NL",{style:"currency",currency:"EUR",minimumFractionDigits:3,maximumFractionDigits:3})}/kWh` : ""}
          ${row.location ? ` · ${esc(row.location)}` : ""}
        </div>`
      : "";

    return `<div class="row ${charging?"cost-charge-row":""}">
      <div>${charging?"⚡":"💶"}</div>
      <div>
        <div class="row-title">${deposit?"💳 Aanbetaling · ":""}${esc(visibleCostDescription(row.description)||"Kostenpost")}</div>
        <div class="row-meta">${esc(row.date||"")} · ${esc(row.stop_id || row.location || "niet gekoppeld")} · ${charging?"laden":esc(row.category||"other")}</div>
        ${chargeMeta}
      </div>
      <div class="amount">
        ${euro(row.amount_cents)}
        ${row.receipt_path ? `<button class="cost-receipt-btn" type="button" data-receipt-path="${esc(row.receipt_path)}">🧾 Bon</button>` : ""}
        <button class="cost-edit-btn" type="button" data-edit-cost="${esc(row.id)}">✏️ Wijzigen</button>
        <button class="cost-delete-btn" type="button" data-delete-cost="${esc(row.id)}">🗑️ Wissen</button>
      </div>
    </div>`;
  }).join("");
}

async function detectManualCostLocation(){
  const select=document.getElementById("cStop");
  const custom=document.getElementById("cCustomLocation");
  const msg=document.getElementById("costFormMsg");

  msg.innerHTML='<div class="notice">📍 Je telefoon bepaalt de huidige locatie…</div>';

  try{
    const pos=await getCurrentPositionPromise({enableHighAccuracy:true,timeout:12000,maximumAge:60000});
    const label=await reverseGeocodeLocation(pos.coords.latitude,pos.coords.longitude);
    const inferred=inferReceiptStop("","",label);

    if(inferred){
      select.value=inferred;
      custom.value="";
      custom.hidden=true;
      msg.innerHTML='<div class="notice"><span class="ok">✓ Huidige reislocatie herkend.</span></div>';
    }else{
      select.value="__custom_location__";
      custom.value=label;
      custom.hidden=false;
      msg.innerHTML='<div class="notice"><span class="ok">✓ Locatie door je telefoon ingevuld.</span></div>';
    }
  }catch(err){
    console.error(err);
    select.value="";
    custom.hidden=true;
    msg.innerHTML='<div class="notice"><span class="error">Locatie kon niet worden bepaald. Kies ‘Locatie in tekst toevoegen’ om deze zelf in te vullen.</span></div>';
  }
}

function normalizeOcrLine(line){
  return String(line||"").replace(/\s+/g," ").trim();
}

function parseEuroNumber(raw){
  let value=String(raw||"")
    .replace(/[€$£]/g,"")
    .replace(/\s/g,"")
    .replace(/[^\d,.\-]/g,"");

  if(!value) return NaN;

  const comma=value.lastIndexOf(",");
  const dot=value.lastIndexOf(".");

  if(comma>=0 && dot>=0){
    if(comma>dot){
      value=value.replace(/\./g,"").replace(",",".");
    }else{
      value=value.replace(/,/g,"");
    }
  }else if(comma>=0){
    value=value.replace(/\./g,"").replace(",",".");
  }else if(dot>=0){
    const decimals=value.length-dot-1;
    if(decimals===3 && value.indexOf(".")===dot){
      value=value.replace(".","");
    }
  }

  const number=Number(value);
  return Number.isFinite(number) ? number : NaN;
}

function receiptAmountsFromLine(line){
  const matches=String(line).match(/(?:€\s*)?-?\d{1,5}(?:[.,]\d{2})(?!\d)/g) || [];
  return matches
    .map(raw=>parseEuroNumber(raw))
    .filter(n=>Number.isFinite(n) && n>=0.01 && n<100000);
}

function receiptDateFromText(text){
  const patterns=[
    /\b(\d{1,2})[.\-/](\d{1,2})[.\-/](20\d{2})\b/,
    /\b(20\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})\b/
  ];

  for(const pattern of patterns){
    const m=String(text).match(pattern);
    if(!m) continue;

    let y,mn,d;
    if(m[1].length===4){
      y=Number(m[1]); mn=Number(m[2]); d=Number(m[3]);
    }else{
      d=Number(m[1]); mn=Number(m[2]); y=Number(m[3]);
    }

    if(y>=2020 && y<=2035 && mn>=1 && mn<=12 && d>=1 && d<=31){
      return `${y}-${String(mn).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }
  }

  return "";
}

function receiptMerchantFromLines(lines){
  const skip=/\b(kassenbon|rechnung|receipt|bon\b|beleg|fattura|scontrino|datum|date\b|tel\b|telefon|telephone|www\.|http|ust|mwst|btw|vat|steuer|tax|iban|bic|kaart|karte|card|cash|contant|subtotal|summe|totaal|total)\b/i;

  const candidates=lines.slice(0,12).filter(line=>{
    if(line.length<3 || line.length>70) return false;
    if(skip.test(line)) return false;
    if(!/[A-Za-zÀ-ÿ]/.test(line)) return false;
    const digits=(line.match(/\d/g)||[]).length;
    return digits < Math.max(5,line.length*.35);
  });

  return candidates[0] || "";
}

function receiptLocationFromLines(lines){
  const postPatterns=[
    /\b\d{4}\s?[A-Z]{2}\b/i,
    /\b\d{5}\s+[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]{2,}/,
    /\bI-?\d{5}\s+[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]{2,}/i
  ];

  for(const line of lines){
    if(postPatterns.some(p=>p.test(line))) return line;
  }

  const known=lines.find(line=>
    /Baiersbronn|Hinterlangenbach|Völs|Vols|Fi[eè]|Schlern|Sciliar|Balderschwang|Allg[aä]u|S[uü]dtirol|South Tyrol/i.test(line)
  );
  return known || "";
}

function inferReceiptCategory(text,merchant=""){
  const hay=(merchant+" "+text).toLowerCase();

  if(/hotel|gasthof|pension|zimmer|overnight|übernacht|halfpension|halbpension|albergo/.test(hay)) return "hotel";
  if(/restaurant|ristorante|pizzeria|cafe|café|bar\b|bistro|trattoria|gastronomie|imbiss|essen|dinner|lunch/.test(hay)) return "restaurant";
  if(/supermarkt|supermarket|markt\b|lidl|aldi|edeka|rewe|spar\b|coop\b|conad|despar|boodschap/.test(hay)) return "groceries";
  if(/charge|charging|laden|ladesäule|ladestation|kwh|ionity|enbw|tesla supercharger/.test(hay)) return "charging";
  if(/tankstelle|fuel|diesel|benz|petrol|esso|shell|aral|eni\b|q8\b/.test(hay)) return "fuel";
  if(/parkhaus|parking|parcheggio|parkeren|parkticket/.test(hay)) return "parking";
  if(/maut|toll|vignette|autostrada|péage|pedaggio/.test(hay)) return "toll";
  if(/museum|bahn\b|seilbahn|gondel|cable car|ticket|eintritt|ingresso|zwembad|pool|therme/.test(hay)) return "activity";
  if(/hund|dog\b|honden|cane\b|tierarzt|veterin/.test(hay)) return "dogs";

  return "other";
}

function inferReceiptPayment(text){
  const hay=String(text).toLowerCase();
  if(/barzahlung|bargeld|cash\b|contant|contanti/.test(hay)) return "Contant";
  if(/visa|mastercard|american express|credit card|kreditkarte/.test(hay)) return "Creditcard";
  if(/maestro|ec-karte|debit|pin\b|bancontact|girocard/.test(hay)) return "Pin";
  if(/apple pay|google pay|paypal|app payment/.test(hay)) return "App";
  if(/ladekarte|laadpas|charging card/.test(hay)) return "Laadpas";
  return "";
}

function inferReceiptStop(text,date,location=""){
  const hay=(String(text)+" "+String(location)).toLowerCase();

  const direct=[
    ["baiersbronn",/baiersbronn|hinterlangenbach|forsthaus\s+auerhahn|schwarzwald/],
    ["zuid-tirol",/v[oö]ls|fi[eè]\s+allo|schlern|sciliar|hotel\s+emmy|s[uü]dtirol|south tyrol/],
    ["balderschwang",/balderschwang|torghele|allg[aä]u/]
  ];

  for(const [id,pattern] of direct){
    if(pattern.test(hay)) return id;
  }

  if(date){
    const stop=tripStops().find(s=>date>=s.arrival && date<=s.departure);
    if(stop) return stop.id;
  }

  return "";
}

function receiptAmountFromLines(lines){
  const totalWords=/\b(total|totaal|gesamt|summe|endsumme|zu zahlen|betrag|amount|totale|importo|da pagare|payment)\b/i;
  const subtotalWords=/\b(subtotal|zwischensumme|subtotaal)\b/i;

  const totalCandidates=[];
  const allCandidates=[];

  lines.forEach((line,index)=>{
    const amounts=receiptAmountsFromLine(line);
    amounts.forEach(amount=>allCandidates.push({amount,index,line}));

    if(totalWords.test(line) && !subtotalWords.test(line)){
      amounts.forEach(amount=>totalCandidates.push({amount,index,line}));
    }
  });

  if(totalCandidates.length){
    // Receipts frequently repeat totals; the last plausible total line is usually safest.
    return totalCandidates[totalCandidates.length-1].amount;
  }

  if(!allCandidates.length) return NaN;

  // Fallback: the largest plausible amount is more often the receipt total than a line item.
  return Math.max(...allCandidates.map(x=>x.amount));
}

function receiptRecognitionConfidence(parsed){
  let score=0;
  if(Number.isFinite(parsed.amount) && parsed.amount>0) score+=35;
  if(parsed.date) score+=20;
  if(parsed.merchant) score+=20;
  if(parsed.location) score+=10;
  if(parsed.category && parsed.category!=="other") score+=10;
  if(parsed.payment) score+=5;
  return Math.min(100,score);
}

function parseReceiptOcr(text){
  const lines=String(text||"")
    .split(/\r?\n/)
    .map(normalizeOcrLine)
    .filter(Boolean);

  const merchant=receiptMerchantFromLines(lines);
  const date=receiptDateFromText(text);
  const location=receiptLocationFromLines(lines);
  const amount=receiptAmountFromLines(lines);
  const category=inferReceiptCategory(text,merchant);
  const payment=inferReceiptPayment(text);
  const stop=inferReceiptStop(text,date,location);

  const parsed={
    text,
    lines,
    merchant,
    date,
    location,
    amount,
    category,
    payment,
    stop
  };
  parsed.confidence=receiptRecognitionConfidence(parsed);
  return parsed;
}

function fillReceiptReview(parsed){
  receiptLastParsed=parsed;

  document.getElementById("receiptAmount").value=
    Number.isFinite(parsed.amount)
      ? parsed.amount.toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2})
      : "";

  document.getElementById("receiptDate").value=parsed.date || dateOnlyLocal();
  document.getElementById("receiptMerchant").value=parsed.merchant || "";
  if(parsed.location) document.getElementById("receiptLocation").value=parsed.location;
  setReceiptCategoryChoice(parsed.category || "other");
  document.getElementById("receiptStop").value=parsed.stop || "";
  const payment=document.getElementById("receiptPayment");
  const customPayment=document.getElementById("receiptCustomPayment");
  const knownPayment=!parsed.payment || [...payment.options].some(option=>option.value===parsed.payment && option.value!=="__custom_payment__");
  payment.value=knownPayment ? parsed.payment || "" : "__custom_payment__";
  customPayment.hidden=knownPayment;
  customPayment.value=knownPayment ? "" : parsed.payment || "";
  document.getElementById("receiptPaidBy").value="";
  document.getElementById("receiptDescription").value=parsed.merchant || "";
  document.getElementById("receiptRawText").value=parsed.text || "";

  const confidence=document.getElementById("receiptConfidence");
  confidence.textContent=`Herkenning ${parsed.confidence}%`;
  confidence.className="receipt-confidence "+(
    parsed.confidence>=75 ? "good" :
    parsed.confidence>=50 ? "medium" : "low"
  );

  document.getElementById("saveReceiptCost").disabled=
    !(Number.isFinite(parsed.amount) && parsed.amount>0);
  document.getElementById("rescanReceipt").disabled=false;
}

async function getReceiptOcrWorker(){
  if(receiptOcrWorker) return receiptOcrWorker;
  if(!window.Tesseract) throw new Error("Bonherkenning kon niet worden geladen. Controleer de internetverbinding.");

  setReceiptStatus("OCR-engine voorbereiden…",0.04);

  receiptOcrWorker=await Tesseract.createWorker(
    "eng+deu+nld+ita",
    1,
    {
      workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",
      corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5",
      langPath:"https://tessdata.projectnaptha.com/4.0.0",
      logger:m=>{
        if(m.status==="recognizing text"){
          setReceiptStatus(`Bon lezen… ${Math.round((m.progress||0)*100)}%`,0.10+(m.progress||0)*0.85);
        }else if(m.status){
          setReceiptStatus("Bonherkenning: "+m.status,Math.max(0.04,(m.progress||0)*0.15));
        }
      }
    }
  );

  return receiptOcrWorker;
}

async function scanReceiptFile(file){
  if(!file) return;

  resetReceiptScanner(true);
  const scanGeneration=receiptScanGeneration;
  receiptSelectedFile=file;

  if(receiptPreviewUrl) URL.revokeObjectURL(receiptPreviewUrl);
  receiptPreviewUrl=URL.createObjectURL(file);

  const preview=document.getElementById("receiptPreview");
  const empty=document.getElementById("receiptPreviewEmpty");
  preview.src=receiptPreviewUrl;
  preview.hidden=false;
  empty.hidden=true;

  document.getElementById("saveReceiptCost").disabled=true;
  document.getElementById("rescanReceipt").disabled=true;
  document.getElementById("receiptFormMsg").innerHTML="";

  try{
    setReceiptStatus("Bon voorbereiden…",0.02);
    const worker=await getReceiptOcrWorker();
    const result=await worker.recognize(file);

    if(scanGeneration!==receiptScanGeneration || receiptSelectedFile!==file) return;

    const raw=result?.data?.text || "";
    const parsed=parseReceiptOcr(raw);
    fillReceiptReview(parsed);
    setReceiptStatus(
      parsed.confidence>=75
        ? "✓ Bon gelezen. Controleer de velden en sla daarna op."
        : "Bon gelezen. Vul ontbrekende gegevens zelf aan vóór opslaan.",
      1
    );
  }catch(err){
    if(scanGeneration!==receiptScanGeneration || receiptSelectedFile!==file) return;
    console.error(err);
    setReceiptStatus("Bonherkenning mislukt: "+err.message,0);
    document.getElementById("receiptRawText").value="";
    document.getElementById("rescanReceipt").disabled=false;
    document.getElementById("receiptAmount").focus();
    document.getElementById("receiptFormMsg").innerHTML=
      '<div class="notice"><span class="error">'+esc(err.message)+'</span></div>';
  }
}

async function detectReceiptGpsLocation(){
  const button=document.getElementById("receiptUseGps");
  const location=document.getElementById("receiptLocation");

  const original=button.textContent;
  button.disabled=true;
  button.textContent="🗺️ Kaart doorzoeken…";

  try{
    const pos=await getCurrentPositionPromise({
      enableHighAccuracy:true,
      timeout:12000,
      maximumAge:60000
    });

    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;
    const category=receiptCategoryValue().trim().toLowerCase();
    const merchant=document.getElementById("receiptMerchant").value.trim().toLowerCase();
    const mapCategory={
      hotel:"hotel",
      restaurant:"restaurant",
      groceries:"supermarket",
      charging:"charging",
      fuel:"fuel",
      parking:"parking",
      toll:"toll",
      activity:"attractions",
      dogs:"dogs"
    }[category];

    let nearby=[];
    if(mapCategory){
      try{
        nearby=await fetchEnvironmentPlaces(lat,lon,2,mapCategory);
      }catch(searchError){
        console.warn("Plekken op de kaart zoeken mislukt:",searchError);
      }
    }

    let place=null;
    if(nearby.length){
      place=merchant
        ? nearby.find(item=>{
            const name=String(item.name||"").toLowerCase();
            return name.includes(merchant) || merchant.includes(name);
          }) || nearby[0]
        : nearby[0];
    }

    const fallback=await reverseGeocodeLocation(lat,lon);
    const label=place
      ? [place.name,place.address].filter(Boolean).join(" · ")
      : fallback;
    location.value=label;

    const date=document.getElementById("receiptDate").value || dateOnlyLocal();
    const raw=document.getElementById("receiptRawText").value || "";
    const inferred=inferReceiptStop(raw,date,label);

    if(inferred){
      document.getElementById("receiptStop").value=inferred;
      resetReceiptCustomLocation();
    }else{
      const stop=document.getElementById("receiptStop");
      const custom=document.getElementById("receiptCustomLocation");
      stop.value="__custom_location__";
      custom.hidden=false;
      custom.value=label;
    }

    button.textContent=place ? "✓ Plek op kaart herkend" : "✓ Locatie ingevuld";
  }catch(err){
    if(scanGeneration!==receiptScanGeneration || receiptSelectedFile!==file) return;
    console.error(err);
    button.textContent="🗺️ Locatie niet beschikbaar";
  }finally{
    setTimeout(()=>{
      button.textContent=original;
      button.disabled=false;
    },1800);
  }
}

function receiptFileExtension(file){
  const name=String(file?.name||"bon.jpg");
  const ext=(name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"").toLowerCase();
  return ext || "jpg";
}

async function saveReceiptAsCost(){
  if(!client){
    alert("Maak eerst verbinding met Supabase.");
    return;
  }
  if(!receiptSelectedFile){
    document.getElementById("receiptFormMsg").innerHTML='<div class="notice">Kies eerst een bonfoto.</div>';
    return;
  }

  const rawAmount=document.getElementById("receiptAmount").value.trim().replace(/\./g,"").replace(",",".");
  const amount=Math.round(Number(rawAmount)*100);

  if(!Number.isFinite(amount) || amount<=0){
    document.getElementById("receiptFormMsg").innerHTML='<div class="notice">Controleer het bedrag.</div>';
    return;
  }

  const save=document.getElementById("saveReceiptCost");
  save.disabled=true;
  save.textContent="Bon opslaan…";

  let receiptPath=null;

  try{
    const date=document.getElementById("receiptDate").value || dateOnlyLocal();
    const merchant=document.getElementById("receiptMerchant").value.trim();
    const ext=receiptFileExtension(receiptSelectedFile);
    const folder=date.slice(0,7) || "onbekend";
    const unique=(crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2));
    receiptPath=`${currentTripId}/receipts/${folder}/${unique}.${ext}`;

    const {error:uploadError}=await client.storage
      .from("vakantie-media")
      .upload(receiptPath,receiptSelectedFile,{
        contentType:receiptSelectedFile.type || "image/jpeg",
        upsert:false
      });

    if(uploadError) throw uploadError;

    const record={
      trip_id:currentTripId,
      stop_id:receiptStopValue() || null,
      amount_cents:amount,
      category:receiptCategoryValue(),
      date,
      description:storedCostDescription(
        document.getElementById("receiptDescription").value.trim() || merchant || "Gescande bon",
        document.getElementById("receiptIsDeposit").checked
      ),
      created_by:actorName(),
      location:document.getElementById("receiptCustomLocation").value.trim() || document.getElementById("receiptLocation").value.trim() || merchant || "",
      kwh:0,
      paid_by:document.getElementById("receiptPaidBy").value || actorName(),
      payment_method:receiptPaymentValue(),
      receipt_path:receiptPath,
      updated_at:new Date().toISOString()
    };

    const {error:insertError}=await client.from("costs").insert(record);

    if(insertError){
      await client.storage.from("vakantie-media").remove([receiptPath]);
      throw insertError;
    }

    document.getElementById("receiptFormMsg").innerHTML=
      '<div class="notice"><span class="ok">✓ Bon en kostenpost opgeslagen.</span></div>';

    await loadCosts();

    setTimeout(()=>{
      closeReceiptScanner();
      resetReceiptScanner();
    },900);
  }catch(err){
    console.error(err);
    document.getElementById("receiptFormMsg").innerHTML=
      '<div class="notice"><span class="error">Opslaan mislukt: '+esc(err.message)+'</span></div>';
    save.disabled=false;
  }finally{
    save.textContent="✓ Bon controleren & opslaan";
  }
}

async function loadMemories(){
  if(!client) return;

  const list=document.getElementById("memoryList");
  if(list) list.innerHTML='<div class="empty">Momenten laden…</div>';

  const {data:memoriesRaw,error:memoryError}=await client
    .from("memories")
    .select("*")
    .eq("trip_id",currentTripId)
    .order("created_at",{ascending:false});

  const memories=(memoriesRaw||[]).filter(m=>![TRIP_META_MOOD,TRIP_STOP_MOOD].includes(m.mood));

  if(memoryError){
    if(list) list.innerHTML='<div class="empty">'+esc(memoryError.message)+'</div>';
    return;
  }

  const {data:photos,error:photoError}=await client
    .from("photos")
    .select("*")
    .eq("trip_id",currentTripId)
    .order("created_at",{ascending:true});

  if(photoError){
    console.error(photoError);
  }

  const photoMap={};
  for(const photo of (photos||[])){
    try{
      const {data,error}=await client.storage
        .from("vakantie-media")
        .createSignedUrl(photo.storage_path,60*60);

      if(error) throw error;

      (photoMap[photo.memory_id] ||= []).push({
        ...photo,
        signed_url:data.signedUrl
      });
    }catch(err){
      console.error("Foto kon niet worden geladen",err);
    }
  }

  document.getElementById("kpiMemories").textContent=(memories||[]).length;
  if(document.getElementById("tripMemoryCount")) document.getElementById("tripMemoryCount").textContent=(memories||[]).length;

  if(!list) return;

  if(!(memories||[]).length){
    list.innerHTML='<div class="empty">Nog geen momenten opgeslagen.</div>';
    return;
  }

  list.innerHTML=(memories||[]).map(memory=>{
    const attached=photoMap[memory.id]||[];

    let media='';
    if(attached.length===1){
      media=`<img class="memory-card-photo" src="${esc(attached[0].signed_url)}" alt="">`;
    }else if(attached.length>1){
      media=`<div class="memory-card-photos ${attached.length===1?"one":""}">
        ${attached.slice(0,4).map(p=>`<img src="${esc(p.signed_url)}" alt="">`).join("")}
      </div>`;
    }else{
      media='<div class="memory-empty-photo">📷</div>';
    }

    const created=memory.created_at
      ? new Date(memory.created_at).toLocaleString("nl-NL",{
          day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"
        })
      : "";

    const meta=[
      displayMemoryLocation(memory.stop_id),
      memory.mood ? "sfeer: "+memory.mood : "",
      attached.length ? `${attached.length} foto${attached.length===1?"":"\'s"}` : ""
    ].filter(Boolean).join(" · ");

    return `<article class="memory-card">
      ${media}
      <div class="memory-card-body">
        <div class="memory-card-head">
          <span class="memory-author">🛏️ ${esc(memory.created_by||"Onbekend")}</span>
          <span class="memory-date">${esc(created)}</span>
        </div>
        <div class="memory-text">${esc(memory.text||"Moment")}</div>
        <div class="memory-meta">${esc(meta)}</div>
      </div>
    </article>`;
  }).join("");
}

function updateHotelCountdowns(){
  const now = new Date();

  document.querySelectorAll("[data-countdown-full]").forEach(panel=>{
    const target = new Date(panel.dataset.countdownFull);
    let diff = Math.max(0, target - now);

    const days = Math.floor(diff / 86400000);
    diff -= days * 86400000;
    const hours = Math.floor(diff / 3600000);
    diff -= hours * 3600000;
    const minutes = Math.floor(diff / 60000);
    diff -= minutes * 60000;
    const seconds = Math.floor(diff / 1000);

    panel.querySelector('[data-part="days"]').textContent = days;
    panel.querySelector('[data-part="hours"]').textContent = String(hours).padStart(2,"0");
    panel.querySelector('[data-part="minutes"]').textContent = String(minutes).padStart(2,"0");
    panel.querySelector('[data-part="seconds"]').textContent = String(seconds).padStart(2,"0");

    const note = panel.querySelector("[data-note]");
    if(note){
      const dayText = days === 1 ? "1 nachtje slapen." : `${days + 1} nachtjes slapen.`;
      if(panel.closest('[data-hotel-stop="zuid-tirol"]')){
        note.textContent = `De koffers doen nog alsof ze rustig zijn: nog ${days + 1} dagen.`;
      }else{
        note.textContent = `${dayText} De honden rekenen waarschijnlijk liever in ontbijtjes.`;
      }
    }
  });
}


function updateRegionalClocks(){
  const now = new Date();
  const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
  const minutes = now.getMinutes() + seconds / 60;
  const hours = (now.getHours() % 12) + minutes / 60;

  document.querySelectorAll('.animated-hands').forEach(group=>{
    const hourHand = group.querySelector('.hour-hand');
    const minuteHand = group.querySelector('.minute-hand');
    const secondHand = group.querySelector('.second-hand');
    if(hourHand) hourHand.style.transform = `rotate(${hours * 30}deg)`;
    if(minuteHand) minuteHand.style.transform = `rotate(${minutes * 6}deg)`;
    if(secondHand) secondHand.style.transform = `rotate(${seconds * 6}deg)`;
  });
}

function getTravelStage(){
  const today=dateOnlyLocal();
  const meta=tripMeta();
  const stops=tripStops();

  if(!stops.length){
    return {from:"home",start:meta.start_date,end:meta.end_date,target:meta.home||"Thuis",currentHotel:"Thuis"};
  }

  if(today<stops[0].arrival){
    return {from:"home",start:meta.start_date,end:stops[0].arrival,target:stops[0].place||stops[0].city,currentHotel:"Thuis"};
  }

  for(let i=0;i<stops.length;i++){
    const stop=stops[i];
    if(today>=stop.arrival && today<stop.departure){
      const next=stops[i+1];
      return {
        from:stop.id,
        start:stop.arrival,
        end:stop.departure,
        target:next ? (next.place||next.city) : (meta.home||"Thuis"),
        currentHotel:stop.hotel||stop.city
      };
    }
  }

  const last=stops[stops.length-1];
  return {from:last.id,start:last.arrival,end:meta.end_date,target:meta.home||"Thuis",currentHotel:last.hotel||last.city};
}

let altimeterMap=null;
let altimeterMarker=null;
let altimeterLine=null;
let altimeterWatchId=null;
let trackPoints=[];

function initAltimeterMap(){
  if(!window.L || altimeterMap) return;
  altimeterMap=L.map("altimeterMap",{zoomControl:true}).setView([48.56,8.22],11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }).addTo(altimeterMap);

  altimeterLine=L.polyline([],{
    weight:4,
    opacity:.85
  }).addTo(altimeterMap);
}

function updateGpsBadge(text){
  document.getElementById("gpsBadge").textContent=text;
}


let terrainElevationLastFetch=0;
let terrainElevationLastLat=null;
let terrainElevationLastLon=null;
let terrainElevationBusy=false;

function distanceMeters(lat1,lon1,lat2,lon2){
  if(lat2===null || lon2===null) return Infinity;
  const R=6371000;
  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;
  const dp=(lat2-lat1)*Math.PI/180;
  const dl=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

async function updateTerrainElevation(lat,lon){
  const altitudeEl=document.getElementById("currentAltitude");
  const altitudeUnit=document.getElementById("currentAltitudeUnit");
  const altitudeHint=document.getElementById("altitudeHint");

  const moved=distanceMeters(
    lat,lon,
    terrainElevationLastLat,terrainElevationLastLon
  );

  // Niet op ieder GPS-tikje opnieuw opvragen.
  if(terrainElevationBusy) return;
  if(Date.now()-terrainElevationLastFetch<12000 && moved<60) return;

  terrainElevationBusy=true;
  altitudeHint.textContent="Terreinhoogte ophalen…";

  try{
    const url="https://api.open-meteo.com/v1/elevation?"+
      new URLSearchParams({
        latitude:String(lat),
        longitude:String(lon)
      });

    const response=await fetch(url);
    if(!response.ok) throw new Error("hoogteservice niet bereikbaar");

    const json=await response.json();
    const value=Array.isArray(json.elevation) ? Number(json.elevation[0]) : NaN;

    if(Number.isFinite(value)){
      altitudeEl.textContent=Math.round(value);
      altitudeUnit.textContent="m";
      altitudeHint.textContent="Actuele terreinhoogte";
      terrainElevationLastFetch=Date.now();
      terrainElevationLastLat=lat;
      terrainElevationLastLon=lon;
    }else{
      throw new Error("geen hoogtewaarde ontvangen");
    }
  }catch(err){
    console.error(err);
    altitudeEl.textContent="—";
    altitudeUnit.textContent="";
    altitudeHint.textContent="Hoogte tijdelijk niet beschikbaar";
  }finally{
    terrainElevationBusy=false;
  }
}

function startAltimeter(){
  const button=document.getElementById("startAltimeter");
  const status=document.getElementById("altimeterStatus");

  if(altimeterWatchId!==null){
    navigator.geolocation.clearWatch(altimeterWatchId);
    altimeterWatchId=null;
    button.textContent="Start live hoogtemeter";
    button.classList.remove("active");
    updateGpsBadge("GPS uit");
    status.textContent="Live meting gestopt.";
    return;
  }

  if(!navigator.geolocation){
    status.textContent="Deze browser ondersteunt geen GPS-locatie.";
    return;
  }

  initAltimeterMap();
  button.textContent="Stop live hoogtemeter";
  button.classList.add("active");
  updateGpsBadge("GPS aan");
  status.textContent="GPS-signaal zoeken…";

  altimeterWatchId=navigator.geolocation.watchPosition(
    pos=>{
      const c=pos.coords;
      const latlng=[c.latitude,c.longitude];

      if(altimeterMarker){
        altimeterMarker.setLatLng(latlng);
      }else{
        altimeterMarker=L.circleMarker(latlng,{
          radius:7,
          weight:3,
          fillOpacity:1
        }).addTo(altimeterMap);
      }

      trackPoints.push(latlng);
      altimeterLine.setLatLngs(trackPoints);

      if(trackPoints.length===1){
        altimeterMap.setView(latlng,13);
      }else{
        altimeterMap.panTo(latlng,{animate:true});
      }

      const altitudeEl=document.getElementById("currentAltitude");
      const altitudeUnit=document.getElementById("currentAltitudeUnit");
      const altitudeHint=document.getElementById("altitudeHint");

      if(Number.isFinite(c.altitude)){
        altitudeEl.textContent=Math.round(c.altitude);
        altitudeUnit.textContent="m";
        altitudeHint.textContent=c.altitudeAccuracy
          ? `GPS-hoogte · ± ${Math.round(c.altitudeAccuracy)} m`
          : "GPS-hoogte";
      }else{
        // Veel telefoons/browsers leveren geen GPS-hoogte. Gebruik dan
        // live terreinhoogte op de actuele GPS-coördinaat.
        updateTerrainElevation(c.latitude,c.longitude);
      }

      const speedEl=document.getElementById("currentSpeed");
      const speedUnit=document.getElementById("currentSpeedUnit");
      const speedHint=document.getElementById("speedHint");

      if(Number.isFinite(c.speed)){
        speedEl.textContent=Math.round(c.speed*3.6);
        speedUnit.textContent="km/u";
        speedHint.textContent="Live GPS";
      }else{
        speedEl.textContent="—";
        speedUnit.textContent="";
        speedHint.textContent="Snelheid niet beschikbaar";
      }

      status.textContent=`GPS actief · nauwkeurigheid ongeveer ${Math.round(c.accuracy)} m`;
    },
    err=>{
      console.error(err);
      status.textContent="GPS kon niet worden gestart: "+err.message;
      updateGpsBadge("GPS fout");
      button.textContent="Start live hoogtemeter";
      button.classList.remove("active");
      altimeterWatchId=null;
    },
    {
      enableHighAccuracy:true,
      maximumAge:2000,
      timeout:15000
    }
  );
}

function dateOnlyLocal(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatHotelPeriod(stop){
  const tripStop=tripStops().find(s=>s.id===stop);
  const arr=document.querySelector(`[data-arrival="${stop}"]`)?.value || HOTEL_DEFAULTS[stop]?.arrival || tripStop?.arrival;
  const dep=document.querySelector(`[data-departure="${stop}"]`)?.value || HOTEL_DEFAULTS[stop]?.departure || tripStop?.departure;
  if(!arr || !dep) return "";
  const a=new Date(arr+"T00:00:00");
  const d=new Date(dep+"T00:00:00");
  const nights=Math.round((d-a)/86400000);
  const fmt=x=>x.toLocaleDateString("nl-NL",{day:"numeric",month:"short"}).replace(".","");
  return `${fmt(a).toUpperCase()} – ${fmt(d).toUpperCase()} · ${nights} NACHTEN`;
}

async function resolveHotelCoordinates(hotel){
  const cacheKey="vakantie_coords_"+hotel.stop;
  const cached=localStorage.getItem(cacheKey);
  if(cached){
    try{return JSON.parse(cached);}catch(e){}
  }

  const url="https://geocoding-api.open-meteo.com/v1/search?"+
    new URLSearchParams({
      name:hotel.geocode,
      count:"5",
      language:"nl",
      countryCode:hotel.country,
      format:"json"
    });

  const r=await fetch(url);
  if(!r.ok) throw new Error("Locatie kon niet worden opgehaald");
  const j=await r.json();
  if(!j.results?.length) throw new Error("Geen locatie gevonden voor "+hotel.geocode);

  const best=j.results[0];
  const coords={lat:best.latitude,lon:best.longitude,timezone:best.timezone,elevation:best.elevation};
  localStorage.setItem(cacheKey,JSON.stringify(coords));
  return coords;
}

async function fetchLiveWeather(hotel){
  const coords=await resolveHotelCoordinates(hotel);
  const params=new URLSearchParams({
    latitude:String(coords.lat),
    longitude:String(coords.lon),
    current:"temperature_2m,weather_code,wind_speed_10m",
    hourly:"temperature_2m,precipitation_probability,weather_code,wind_speed_10m",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max",
    timezone:"auto",
    forecast_days:"7"
  });

  const r=await fetch("https://api.open-meteo.com/v1/forecast?"+params.toString());
  if(!r.ok) throw new Error("Weer kon niet worden opgehaald");
  const weather=await r.json();
  weather._coords=coords;
  weather._fetchedAt=new Date().toISOString();
  localStorage.setItem("vakantie_weather_"+hotel.stop,JSON.stringify(weather));
  return weather;
}

function todayHourlyIndices(weather){
  const today=weather.daily?.time?.[0];
  const result=[];
  (weather.hourly?.time||[]).forEach((t,i)=>{
    if(t.slice(0,10)===today) result.push(i);
  });
  return result;
}

function calculateWalkWindow(weather){
  const idx=todayHourlyIndices(weather);
  if(!idx.length) return null;

  const candidates=idx.filter(i=>{
    const h=Number(weather.hourly.time[i].slice(11,13));
    return h>=6 && h<=18;
  });

  let best=null;
  for(let x=0;x<=candidates.length-3;x++){
    const sample=candidates.slice(x,x+3);
    if(sample.length<3) continue;

    const precip=sample.reduce((s,i)=>s+(weather.hourly.precipitation_probability[i]||0),0)/3;
    const temp=sample.reduce((s,i)=>s+(weather.hourly.temperature_2m[i]||0),0)/3;
    const wind=sample.reduce((s,i)=>s+(weather.hourly.wind_speed_10m[i]||0),0)/3;

    let score=precip*1.8 + Math.abs(temp-18)*3 + Math.max(0,wind-22)*1.5;
    if(temp>25) score+=(temp-25)*7;
    if(temp<6) score+=(6-temp)*5;

    if(!best || score<best.score){
      best={score,start:weather.hourly.time[sample[0]],end:weather.hourly.time[sample[2]],precip,temp,wind};
    }
  }
  return best;
}

async function fetchWalkingHighlights(lat,lon,radiusKm){
  const radius=Math.round(radiusKm*1000);

  const query=`[out:json][timeout:22];(
    node(around:${radius},${lat},${lon})["tourism"="viewpoint"]["name"];
    way(around:${radius},${lat},${lon})["tourism"="viewpoint"]["name"];
    node(around:${radius},${lat},${lon})["natural"="waterfall"]["name"];
    way(around:${radius},${lat},${lon})["natural"="waterfall"]["name"];
    node(around:${radius},${lat},${lon})["tourism"="picnic_site"]["name"];
    node(around:${radius},${lat},${lon})["amenity"="shelter"]["name"];
    node(around:${radius},${lat},${lon})["natural"="peak"]["name"];
    node(around:${radius},${lat},${lon})["tourism"="attraction"]["name"];
    node(around:${radius},${lat},${lon})["historic"]["name"];
  );out center tags;`;

  const endpoints=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  let lastError=null;

  for(const endpoint of endpoints){
    try{
      const json=await fetchJsonWithTimeout(endpoint,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:"data="+encodeURIComponent(query)
      },9000);

      const origin={lat:Number(lat),lon:Number(lon)};
      const seen=new Set();

      return (json.elements||[])
        .map(el=>{
          const p=el.type==="node"
            ? {lat:el.lat,lon:el.lon}
            : el.center ? {lat:el.center.lat,lon:el.center.lon} : null;

          if(!p || !el.tags?.name) return null;

          const name=el.tags.name.trim();
          const key=name.toLowerCase();
          if(seen.has(key)) return null;
          seen.add(key);

          const distance=haversineKm(origin,p);
          if(distance<0.6 || distance>radiusKm) return null;

          const type =
            el.tags.tourism==="viewpoint" ? "Uitzichtspunt" :
            el.tags.natural==="waterfall" ? "Waterval" :
            el.tags.tourism==="picnic_site" ? "Picknickplek" :
            el.tags.amenity==="shelter" ? "Schuil-/rustplek" :
            el.tags.natural==="peak" ? "Bergtop" :
            el.tags.historic ? "Historische plek" :
            "Bezienswaardigheid";

          return {name,lat:p.lat,lon:p.lon,distance,type,tags:el.tags};
        })
        .filter(Boolean)
        .sort((a,b)=>a.distance-b.distance);
    }catch(err){
      lastError=err;
      console.warn("Overpass wandelen mislukt",endpoint,err);
    }
  }

  throw lastError || new Error("Geen wandelpunten gevonden.");
}

function walkingPointScore(point,profile){
  const expectedHalf=profile.targetKm/2.4;
  const distancePenalty=Math.abs(point.distance-expectedHalf);

  let beauty=0;
  if(point.type==="Waterval") beauty=4;
  else if(point.type==="Uitzichtspunt") beauty=3.5;
  else if(point.type==="Picknickplek") beauty=2.5;
  else if(point.type==="Historische plek") beauty=2;
  else if(point.type==="Schuil-/rustplek") beauty=1.8;
  else if(point.type==="Bergtop") beauty=profile.key==="easy" ? -4 : 4;
  else beauty=1;

  return beauty-distancePenalty;
}

function walkingPointGroups(points,profile){
  const usable=points
    .filter(p=>{
      if(profile.key==="easy" && p.type==="Bergtop") return false;
      return true;
    })
    .sort((a,b)=>walkingPointScore(b,profile)-walkingPointScore(a,profile));

  const groups=[];

  for(let i=0;i<usable.length;i++){
    if(groups.length>=12) break;

    const first=usable[i];

    // Zoek een tweede punt dat niet praktisch in dezelfde richting/plek ligt.
    const second=usable.find((p,j)=>
      j!==i &&
      haversineKm(first,p)>0.9 &&
      p.distance>0.6 &&
      Math.abs(p.distance-first.distance)<profile.searchRadius*.70
    );

    if(!second) continue;

    const group=[first,second];

    if(profile.maxStops>=3){
      const third=usable.find((p,j)=>
        j!==i &&
        p!==second &&
        haversineKm(first,p)>0.9 &&
        haversineKm(second,p)>0.9
      );
      if(third) group.push(third);
    }

    groups.push(group);
  }

  return groups;
}

async function buildFootRoute(origin,points){
  // Expliciete round trip:
  // hotel -> gekozen wandelpunten -> exact hetzelfde hotel.
  const routePoints=[origin,...points,origin];

  const coords=routePoints
    .map(p=>`${Number(p.lon).toFixed(6)},${Number(p.lat).toFixed(6)}`)
    .join(";");

  const url=
    `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${coords}`+
    `?overview=full&geometries=geojson&steps=false&continue_straight=false`;

  const json=await fetchJsonWithTimeout(url,{},11000);
  if(json.code!=="Ok" || !json.routes?.length){
    throw new Error("Voor deze punten kon geen aaneengesloten rondwandeling worden gemaakt.");
  }

  const route=json.routes[0];
  const geometry=route?.geometry?.coordinates || [];

  if(geometry.length<2){
    throw new Error("De wandelrouter gaf geen volledige rondwandeling terug.");
  }

  // Extra controle: laatste punt moet weer praktisch bij het hotel liggen.
  const [firstLon,firstLat]=geometry[0];
  const [lastLon,lastLat]=geometry[geometry.length-1];

  const closeDistance=haversineKm(
    {lat:firstLat,lon:firstLon},
    {lat:lastLat,lon:lastLon}
  );

  if(closeDistance>0.25){
    throw new Error("Deze route eindigt niet betrouwbaar bij het startpunt en is daarom afgekeurd.");
  }

  return route;
}


function roundedCoordKey(lon,lat,precision=4){
  return `${Number(lon).toFixed(precision)},${Number(lat).toFixed(precision)}`;
}

function routeOverlapRatio(route){
  const coords=route?.geometry?.coordinates || [];
  if(coords.length<6) return 1;

  const counts=new Map();
  let segments=0;

  for(let i=1;i<coords.length;i++){
    const [lon1,lat1]=coords[i-1];
    const [lon2,lat2]=coords[i];

    const a=roundedCoordKey(lon1,lat1);
    const b=roundedCoordKey(lon2,lat2);
    if(a===b) continue;

    // Richting negeren: heen en terug over dezelfde weg telt dus dubbel.
    const key=a<b ? `${a}|${b}` : `${b}|${a}`;
    counts.set(key,(counts.get(key)||0)+1);
    segments++;
  }

  if(!segments) return 1;

  let repeated=0;
  for(const count of counts.values()){
    if(count>1) repeated += count-1;
  }

  return repeated/segments;
}

function routeLoopAreaKm2(route){
  const coords=route?.geometry?.coordinates || [];
  if(coords.length<4) return 0;

  const sampleStep=Math.max(1,Math.floor(coords.length/120));
  const sampled=[];
  for(let i=0;i<coords.length;i+=sampleStep) sampled.push(coords[i]);
  if(sampled[sampled.length-1]!==coords[coords.length-1]) sampled.push(coords[coords.length-1]);

  const meanLat=sampled.reduce((s,c)=>s+c[1],0)/sampled.length;
  const kmLon=111.320*Math.cos(meanLat*Math.PI/180);
  const kmLat=110.574;

  let area=0;
  for(let i=0,j=sampled.length-1;i<sampled.length;j=i++){
    const xi=sampled[i][0]*kmLon;
    const yi=sampled[i][1]*kmLat;
    const xj=sampled[j][0]*kmLon;
    const yj=sampled[j][1]*kmLat;
    area+=(xj*yi-xi*yj);
  }
  return Math.abs(area)/2;
}

function validateCircularWalk(route,profile){
  const geometry=route?.geometry?.coordinates || [];
  if(geometry.length<5){
    return {ok:false,reason:"te weinig routegeometrie"};
  }

  const [firstLon,firstLat]=geometry[0];
  const [lastLon,lastLat]=geometry[geometry.length-1];
  const closureKm=haversineKm(
    {lat:firstLat,lon:firstLon},
    {lat:lastLat,lon:lastLon}
  );

  if(closureKm>0.25){
    return {ok:false,reason:"eindpunt ligt niet bij startpunt"};
  }

  const overlap=routeOverlapRatio(route);
  const area=routeLoopAreaKm2(route);

  // Een heen-en-terug-route heeft vrijwel dezelfde segmenten in beide richtingen
  // en omsluit nagenoeg geen oppervlak. Die keuren we af.
  const maxOverlap=profile.key==="easy" ? 0.38 : 0.34;
  const minArea=profile.key==="easy" ? 0.12 : profile.key==="medium" ? 0.20 : 0.35;

  if(overlap>maxOverlap){
    return {
      ok:false,
      reason:`te veel dezelfde weg heen en terug (${Math.round(overlap*100)}% overlap)`
    };
  }

  if(area<minArea){
    return {
      ok:false,
      reason:"route vormt geen duidelijke lus"
    };
  }

  return {ok:true,overlap,area,closureKm};
}

function sampledRouteCoordinates(route,maxPoints=45){
  const coords=route?.geometry?.coordinates || [];
  if(!coords.length) return [];

  if(coords.length<=maxPoints){
    return coords.map(([lon,lat])=>({lat,lon}));
  }

  const result=[];
  for(let i=0;i<maxPoints;i++){
    const index=Math.round(i*(coords.length-1)/(maxPoints-1));
    const [lon,lat]=coords[index];
    result.push({lat,lon});
  }
  return result;
}

async function routeElevationProfile(route){
  const points=sampledRouteCoordinates(route,45);
  if(!points.length) return {ascent:null,descent:null,min:null,max:null};

  const params=new URLSearchParams({
    latitude:points.map(p=>p.lat.toFixed(6)).join(","),
    longitude:points.map(p=>p.lon.toFixed(6)).join(",")
  });

  const json=await fetchJsonWithTimeout(
    "https://api.open-meteo.com/v1/elevation?"+params.toString(),
    {},
    9000
  );
  const elev=(json.elevation||[]).map(Number).filter(Number.isFinite);
  if(elev.length<2) return {ascent:null,descent:null,min:null,max:null};

  let ascent=0;
  let descent=0;

  for(let i=1;i<elev.length;i++){
    const diff=elev[i]-elev[i-1];

    // Kleine schommelingen uit het 90m-hoogtemodel niet meetellen.
    if(diff>2) ascent+=diff;
    if(diff<-2) descent+=Math.abs(diff);
  }

  return {
    ascent:Math.round(ascent),
    descent:Math.round(descent),
    min:Math.round(Math.min(...elev)),
    max:Math.round(Math.max(...elev))
  };
}

function walkRouteFits(route,elevation,profile){
  const km=route.distance/1000;
  if(km<profile.minKm*.78 || km>profile.maxKm*1.18) return false;

  if(Number.isFinite(elevation.ascent)){
    if(elevation.ascent>profile.maxAscent*1.10) return false;

    if(profile.key==="hard" && elevation.ascent<350) return false;
    if(profile.key==="challenging" && elevation.ascent<180 && km<9) return false;
  }

  return true;
}

function walkDurationText(seconds){
  const mins=Math.round(seconds/60);
  const h=Math.floor(mins/60);
  const m=mins%60;
  return h ? `${h}u ${String(m).padStart(2,"0")}m` : `${m} min`;
}

function walkGoogleUrl(origin,points){
  const here=`${origin.lat},${origin.lon}`;

  const params=new URLSearchParams({
    api:"1",
    origin:here,
    destination:here,
    travelmode:"walking"
  });

  // De waypoints liggen tussen twee identieke hotelcoördinaten:
  // Google Maps opent dus eveneens als rondwandeling.
  if(points.length){
    params.set("waypoints",points.map(p=>`${p.lat},${p.lon}`).join("|"));
  }

  return "https://www.google.com/maps/dir/?"+params.toString();
}

function sleepMs(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}


function nextPaint(){
  return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
}

async function fetchJsonWithTimeout(url,options={},timeoutMs=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);

  try{
    const response=await fetch(url,{
      ...options,
      signal:controller.signal
    });

    if(!response.ok){
      throw new Error(`Service reageert met ${response.status}`);
    }

    return await response.json();
  }finally{
    clearTimeout(timer);
  }
}

function walkFallbackPoints(origin,profile,variant=0){
  const radiusKm={
    easy:1.45,
    medium:2.5,
    challenging:3.8,
    hard:5.8
  }[profile.key] || 2.5;

  // Hoeken liggen bewust verspreid rond het hotel.
  // Daardoor ontstaat hotel -> punt A -> punt B(/C) -> hotel,
  // in plaats van dezelfde weg heen en terug.
  const bearingSets=[
    [300,55,165],
    [245,350,105],
    [205,315,70],
    [270,25,135]
  ];

  const bearings=bearingSets[variant % bearingSets.length];
  const earth=6371;

  function destination(bearingDeg,distanceKm,name){
    const bearing=bearingDeg*Math.PI/180;
    const lat1=origin.lat*Math.PI/180;
    const lon1=origin.lon*Math.PI/180;
    const d=distanceKm/earth;

    const lat2=Math.asin(
      Math.sin(lat1)*Math.cos(d)+
      Math.cos(lat1)*Math.sin(d)*Math.cos(bearing)
    );

    const lon2=lon1+Math.atan2(
      Math.sin(bearing)*Math.sin(d)*Math.cos(lat1),
      Math.cos(d)-Math.sin(lat1)*Math.sin(lat2)
    );

    return {
      lat:lat2*180/Math.PI,
      lon:lon2*180/Math.PI,
      name,
      type:"Automatisch routepunt"
    };
  }

  const count=profile.key==="easy" ? 2 : profile.key==="medium" ? 2 : 3;

  return bearings.slice(0,count).map((bearing,index)=>{
    const scale=index===0 ? 1 : index===1 ? .92 : .82;
    return destination(
      bearing,
      radiusKm*scale,
      `Luspunt ${String.fromCharCode(65+index)}`
    );
  });
}

async function generateWalkRoutes(){
  const profile=currentWalkProfile();
  const status=document.getElementById("walkRouteStatus");
  const button=document.getElementById("findWalkRoutes");
  const other=document.getElementById("otherWalkRoutes");
  const attr=document.getElementById("walkRouteAttribution");

  button.disabled=true;
  other.disabled=true;
  status.className="route-status walk-status-working";
  status.innerHTML='<span class="walk-spinner"></span> Hotellocatie bepalen…';
  document.getElementById("walkRouteCards").innerHTML="";
  await nextPaint();

  let origin=null;

  try{
    const coords=await resolveHotelCoordinates(liveTodayHotel);
    origin={lat:coords.lat,lon:coords.lon};

    status.innerHTML='<span class="walk-spinner"></span> Mooie wandelpunten in de omgeving zoeken…';
    await nextPaint();

    let groups=[];

    try{
      const points=await fetchWalkingHighlights(origin.lat,origin.lon,profile.searchRadius);
      groups=walkingPointGroups(points,profile);
    }catch(highlightError){
      console.warn("Mooie wandelpunten niet bereikbaar; automatische routepunten gebruiken.",highlightError);
    }

    // Als Overpass niets bruikbaars teruggeeft, maken we zelf routekandidaten
    // rond het hotel en laten de echte voetrouter die op het wandelnetwerk snappen.
    if(!groups.length){
      groups=[0,1,2,3].map(variant=>walkFallbackPoints(origin,profile,variant));
      status.innerHTML='<span class="walk-spinner"></span> Wandelpuntenservice niet beschikbaar; ik maak nu routekandidaten direct vanaf het hotel…';
      await nextPaint();
    }

    const shifted=[
      ...groups.slice(walkRouteOffset),
      ...groups.slice(0,walkRouteOffset)
    ];

    const found=[];
    const alternatives=[];
    let attempts=0;

    for(const group of shifted){
      if(found.length>=3 || attempts>=6) break;
      attempts++;

      status.innerHTML=
        `<span class="walk-spinner"></span> Route ${attempts} berekenen en controleren op afstand en hoogtemeters…`;
      await nextPaint();

      try{
        const route=await buildFootRoute(origin,group);

        const loopCheck=validateCircularWalk(route,profile);
        if(!loopCheck.ok){
          console.info("Route afgekeurd als rondwandeling:",loopCheck.reason);
          continue;
        }

        status.innerHTML=
          `<span class="walk-spinner"></span> Route ${attempts}: lus is goed; hoogteprofiel controleren…`;
        await nextPaint();

        let elevation={ascent:null,descent:null,min:null,max:null};
        try{
          elevation=await routeElevationProfile(route);
        }catch(elevError){
          console.warn("Hoogteprofiel niet beschikbaar",elevError);
        }

        const candidate={route,elevation,points:group,origin,loopCheck,googleUrl:walkGoogleUrl(origin,group)};

        if(walkRouteFits(route,elevation,profile)){
          const duplicate=found.some(x=>Math.abs(x.route.distance-route.distance)<250);
          if(!duplicate){
            found.push(candidate);
          }
        }else{
          const duplicate=alternatives.some(x=>Math.abs(x.route.distance-route.distance)<250);
          if(!duplicate) alternatives.push(candidate);
        }
      }catch(routeError){
        console.warn("Rondwandeling kandidaat overgeslagen",routeError);
      }

      if(found.length<3) await sleepMs(1050);
    }

    const nearestAlternatives=alternatives
      .sort((a,b)=>{
        const score=result=>{
          const km=result.route.distance/1000;
          const ascent=Number(result.elevation.ascent)||0;
          return Math.abs(km-profile.targetKm)+Math.max(0,ascent-profile.maxAscent)/250;
        };
        return score(a)-score(b);
      })
      .slice(0,3);
    const displayed=found.length ? found : nearestAlternatives;

    walkRouteResults=displayed;
    renderWalkRouteCards(displayed);

    if(found.length){
      status.className="route-status";
      status.textContent=
        `${found.length} rondwandeling${found.length===1?"":"en"} gevonden voor niveau ${profile.label}. `+
        `Alle voorstellen starten en eindigen bij ${liveTodayHotel.hotel} én gebruiken niet simpelweg dezelfde weg terug.`;
      other.hidden=false;
    }else if(displayed.length){
      status.className="route-status";
      status.innerHTML=`
        <strong>Geen exacte match voor ${esc(profile.label)}, daarom toon ik de beste alternatieven.</strong><br>
        Deze rondwandelingen liggen het dichtst bij de gekozen afstand en stijging. Controleer de afstand en hoogtemeters op de kaarten.`;
      other.hidden=false;
    }else{
      const fallbackGroups=[4,5,6].map(variant=>walkFallbackPoints(origin,profile,variant));
      const fallbackLinks=fallbackGroups.map((group,index)=>`
        <a class="route-link secondary" href="${esc(walkGoogleUrl(origin,group))}" target="_blank" rel="noopener">
          Alternatief ${index+1} openen ↗
        </a>`).join(" ");
      status.className="route-status";
      status.innerHTML=`
        <strong>De routeservice gaf geen bruikbare lus terug; hier zijn automatisch drie andere voorstellen.</strong><br><br>
        ${fallbackLinks}`;
      other.hidden=false;
    }

    if(attr){
      attr.textContent=
        "Route en kaart: OpenStreetMap/FOSSGIS · hoogteprofiel: Open-Meteo/Copernicus DEM.";
    }
  }catch(err){
    console.error(err);

    if(origin){
      showWalkServiceFallback(origin,err?.message);
    }else{
      status.className="route-status error";
      status.textContent="De hotellocatie of wandelservice kon niet worden geladen: "+(err?.message||"onbekende fout");
    }

    other.hidden=false;
  }finally{
    button.disabled=false;
    other.disabled=false;
  }
}

function poiTypeLabel(tags={}){
  if(tags.tourism==="viewpoint") return "Uitzichtspunt";
  if(tags.tourism==="museum") return "Museum";
  if(tags.tourism==="attraction") return "Bezienswaardigheid";
  if(tags.historic==="castle") return "Kasteel";
  if(tags.historic==="ruins") return "Ruïne";
  if(tags.historic==="monument") return "Monument";
  if(tags.natural==="waterfall") return "Waterval";
  if(tags.natural==="peak") return "Bergtop";
  if(tags.leisure==="park") return "Park";
  if(["village","town"].includes(tags.place)) return "Dorp";
  return "Highlight";
}

function poiPriority(tags={}){
  if(tags.tourism==="viewpoint") return 100;
  if(tags.historic==="castle") return 95;
  if(tags.natural==="waterfall") return 92;
  if(tags.tourism==="attraction") return 88;
  if(tags.historic==="ruins") return 84;
  if(tags.tourism==="museum") return 80;
  if(["village","town"].includes(tags.place)) return 76;
  if(tags.natural==="peak") return 70;
  if(tags.leisure==="park") return 65;
  return 50;
}

function haversineKm(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lon-a.lon)*Math.PI/180;
  const p1=a.lat*Math.PI/180;
  const p2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function fetchHighlights(lat,lon,radiusKm,mode="highlights"){
  const radius=Math.round(radiusKm*1000);

  const filters = mode==="villages"
    ? `
      node(around:${radius},${lat},${lon})["place"~"town|village"]["name"];
      way(around:${radius},${lat},${lon})["place"~"town|village"]["name"];
      relation(around:${radius},${lat},${lon})["place"~"town|village"]["name"];`
    : `
      node(around:${radius},${lat},${lon})["tourism"~"attraction|viewpoint|museum"]["name"];
      way(around:${radius},${lat},${lon})["tourism"~"attraction|viewpoint|museum"]["name"];
      relation(around:${radius},${lat},${lon})["tourism"~"attraction|viewpoint|museum"]["name"];
      node(around:${radius},${lat},${lon})["historic"~"castle|ruins|monument"]["name"];
      way(around:${radius},${lat},${lon})["historic"~"castle|ruins|monument"]["name"];
      relation(around:${radius},${lat},${lon})["historic"~"castle|ruins|monument"]["name"];
      node(around:${radius},${lat},${lon})["natural"~"waterfall|peak"]["name"];
      way(around:${radius},${lat},${lon})["natural"~"waterfall|peak"]["name"];
      relation(around:${radius},${lat},${lon})["natural"~"waterfall|peak"]["name"];
      node(around:${radius},${lat},${lon})["leisure"="park"]["name"];
      way(around:${radius},${lat},${lon})["leisure"="park"]["name"];`;

  const query=`[out:json][timeout:22];(${filters});out center tags;`;
  const endpoints=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  let lastError=null;

  for(const endpoint of endpoints){
    try{
      const response=await fetch(endpoint,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:"data="+encodeURIComponent(query)
      });

      if(!response.ok) throw new Error("Highlights-service reageert niet.");
      const json=await response.json();

      const origin={lat:Number(lat),lon:Number(lon)};
      const seen=new Set();

      return (json.elements||[])
        .map(el=>{
          const p=el.type==="node"
            ? {lat:el.lat,lon:el.lon}
            : el.center ? {lat:el.center.lat,lon:el.center.lon} : null;
          if(!p || !el.tags?.name) return null;

          const distance=haversineKm(origin,p);
          const name=el.tags.name.trim();
          const key=name.toLowerCase();

          if(distance<1.8 || distance>radiusKm || seen.has(key)) return null;
          seen.add(key);

          return {
            name,
            lat:p.lat,
            lon:p.lon,
            distance,
            type:poiTypeLabel(el.tags),
            priority:poiPriority(el.tags),
            tags:el.tags
          };
        })
        .filter(Boolean)
        .sort((a,b)=>{
          const as=a.priority-(a.distance*1.5);
          const bs=b.priority-(b.distance*1.5);
          return bs-as;
        });
    }catch(err){
      lastError=err;
      console.warn("Overpass endpoint mislukt",endpoint,err);
    }
  }

  throw lastError || new Error("Geen highlights gevonden.");
}

function chooseDiverseHighlights(items,count=3){
  const chosen=[];
  for(const item of items){
    if(chosen.length>=count) break;
    const tooClose=chosen.some(x=>haversineKm(x,item)<3.0);
    if(!tooClose) chosen.push(item);
  }
  if(chosen.length<count){
    for(const item of items){
      if(chosen.length>=count) break;
      if(!chosen.includes(item)) chosen.push(item);
    }
  }
  return chosen;
}

async function buildOsrmTrip(origin,highlights){
  const coords=[origin,...highlights]
    .map(p=>`${Number(p.lon).toFixed(6)},${Number(p.lat).toFixed(6)}`)
    .join(";");

  const params=new URLSearchParams({
    roundtrip:"true",
    source:"first",
    destination:"any",
    geometries:"geojson",
    overview:"full",
    steps:"false"
  });

  const response=await fetch(
    `https://router.project-osrm.org/trip/v1/driving/${coords}?${params.toString()}`
  );

  if(!response.ok) throw new Error("Routeberekening is tijdelijk niet bereikbaar.");
  const json=await response.json();
  if(json.code!=="Ok" || !json.trips?.length){
    throw new Error("Er kon geen aaneengesloten autoroute worden gemaakt.");
  }
  return json;
}

function destroyPlannerRouteMap(){
  if(plannerRouteMap){
    plannerRouteMap.remove();
    plannerRouteMap=null;
    plannerRouteLayer=null;

}

function renderRouteMap(origin,highlights,trip){
  destroyPlannerRouteMap();

  plannerRouteMap=L.map("plannerRouteMap",{zoomControl:true});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }).addTo(plannerRouteMap);

  const geo=trip.trips[0].geometry;
  plannerRouteLayer=L.geoJSON(geo,{weight:5,opacity:.85}).addTo(plannerRouteMap);

  const hotelMarker=L.marker([origin.lat,origin.lon])
    .addTo(plannerRouteMap)
    .bindPopup("Start/einde · "+esc(liveTodayHotel.hotel));
  plannerRouteMarkers.push(hotelMarker);

  highlights.forEach((p,i)=>{
    const marker=L.marker([p.lat,p.lon])
      .addTo(plannerRouteMap)
      .bindPopup(`${i+1}. ${esc(p.name)}<br>${esc(p.type)}`);
    plannerRouteMarkers.push(marker);
  });

  plannerRouteMap.fitBounds(plannerRouteLayer.getBounds(),{padding:[25,25]});
  setTimeout(()=>plannerRouteMap.invalidateSize(),100);
}

function googleRouteUrl(origin,highlights){
  const destination=`${origin.lat},${origin.lon}`;
  const waypoints=highlights.map(p=>`${p.lat},${p.lon}`).join("|");

  const params=new URLSearchParams({
    api:"1",
    origin:destination,
    destination,
    travelmode:"driving",
    waypoints
  });

  return "https://www.google.com/maps/dir/?"+params.toString();
}

  status.className="route-status";

  highlightsEl.innerHTML="";
  actions.innerHTML="";

  try{
    const coords=await resolveHotelCoordinates(liveTodayHotel);
    const origin={lat:coords.lat,lon:coords.lon};

    const found=await fetchHighlights(origin.lat,origin.lon,plannerRouteRadius,mode);
    if(found.length<2){
      throw new Error("Er zijn te weinig geschikte, benoemde highlights gevonden voor een goede rondrit.");
    }

    const selected=chooseDiverseHighlights(found,3);
    status.textContent=`${found.length} mogelijke highlights gevonden. Ik heb ${selected.length} gevarieerde stops gekozen en bereken nu de rondrit…`;

    const trip=await buildOsrmTrip(origin,selected);

    const km=route.distance/1000;
    const minutes=Math.round(route.duration/60);

    summary.innerHTML=`
      <strong>${km.toFixed(0)} km · ca. ${Math.floor(minutes/60)}u ${String(minutes%60).padStart(2,"0")}m</strong>
      <div class="muted-line">
        Start en einde bij ${esc(liveTodayHotel.hotel)}. De gekozen ${plannerRouteRadius} km is de zoekstraal voor highlights; de daadwerkelijke rondrit kan dus langer zijn.
