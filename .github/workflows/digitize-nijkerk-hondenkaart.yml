name: Digitize Nijkerk hondenkaart

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/digitize_nijkerk_hondenkaart.py'
      - 'tools/digitize_nijkerk_hondenkaart_v2.py'
      - 'tools/filter_nijkerk_digitization.py'
      - '.github/workflows/digitize-nijkerk-hondenkaart.yml'

permissions:
  contents: write

jobs:
  digitize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install map tooling
        run: python -m pip install --disable-pip-version-check pymupdf opencv-python-headless numpy

      - name: Digitize and georeference official Nijkerk map
        run: python tools/digitize_nijkerk_hondenkaart_v2.py

      - name: Remove PDF annotation artifacts and verify anchors
        run: python tools/filter_nijkerk_digitization.py

      - name: Validate GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('whatsup-dog/data/nijkerk-losloopgebieden.geojson')
          r=Path('whatsup-dog/data/digitize-report.json')
          data=json.loads(p.read_text())
          report=json.loads(r.read_text())
          assert data['type']=='FeatureCollection'
          assert report['ok'] is True
          assert 15 <= len(data['features']) <= 22
          assert len(data['features']) == report['feature_count']
          for f in data['features']:
              assert f['geometry']['type']=='Polygon'
              assert f['properties']['status']=='gedigitaliseerd van officiële kaart'
              assert f['properties']['quality']=='digitised-from-official-pdf-v1'
          print('Validated', len(data['features']), 'clean losloop polygons')
          print('Georeference:', report['georef'])
          print('Anchor checks:', report['anchor_checks'])
          PY

      - name: Commit derived map data
        run: |
          git config user.name 'whatsup-dog-map-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add whatsup-dog/data/nijkerk-losloopgebieden.geojson whatsup-dog/data/digitize-report.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit'
          else
            git commit -m 'Improve Nijkerk dog map georeferencing'
            git push
          fi
