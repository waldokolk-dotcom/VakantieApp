name: Validate Whatsup dog

on:
  push:
    paths:
      - 'whatsup-dog/**'
      - 'supabase/**'
      - 'tools/whatsup-dog-ui-smoke.mjs'
      - 'tools/whatsup-dog-community-smoke.mjs'
      - '.github/workflows/validate-whatsup-dog.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check whatsup-dog/app.js
          node --check whatsup-dog/official-areas.js
          node --check whatsup-dog/home.js
          node --check whatsup-dog/smart-report-v3.js
          node --check whatsup-dog/backend-config.js
          node --check whatsup-dog/community-backend.js
          node --check whatsup-dog/community-ui-bridge.js
          node --check whatsup-dog/sw.js
          node --check tools/whatsup-dog-ui-smoke.mjs
          node --check tools/whatsup-dog-community-smoke.mjs
      - name: Validate Nijkerk GeoJSON
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('whatsup-dog/data/nijkerk-losloopgebieden.geojson','utf8'));
          if(data.type!=='FeatureCollection') throw new Error('Not a FeatureCollection');
          if(data.features.length<18||data.features.length>20) throw new Error(`Unexpected polygon count: ${data.features.length}`);
          for(const f of data.features){
            if(f.geometry?.type!=='Polygon') throw new Error('Non-polygon geometry');
            const ring=f.geometry.coordinates?.[0];
            if(!Array.isArray(ring)||ring.length<4) throw new Error('Invalid polygon ring');
          }
          console.log(`Validated ${data.features.length} Nijkerk losloop polygons`);
          NODE
      - name: Verify smart report v3 wiring
        run: |
          test -s whatsup-dog/smart-report-v3.js
          test -s whatsup-dog/smart-report.css
          grep -q 'smart-report-v3.js' whatsup-dog/official-areas.js
          grep -q 'canvas-reencoded-no-original-exif' whatsup-dog/smart-report-v3.js
          grep -q 'beginPick' whatsup-dog/smart-report-v3.js
          grep -q 'finishArea' whatsup-dog/smart-report-v3.js
          grep -q 'mobilenet' whatsup-dog/smart-report-v3.js
          grep -q 'whatsup-dog-v14-community-polygons' whatsup-dog/sw.js
      - name: Verify secure community backend wiring
        run: |
          test -s whatsup-dog/backend-config.js
          test -s whatsup-dog/community-backend.js
          test -s whatsup-dog/community-ui-bridge.js
          test -s supabase/migrations/20260909_whatsup_dog.sql
          grep -q 'signInAnonymously' whatsup-dog/community-backend.js
          grep -q 'createSignedUrl' whatsup-dog/community-backend.js
          grep -q 'wd_shared_report_queue_v1' whatsup-dog/community-backend.js
          grep -q 'community-backend.js' whatsup-dog/official-areas.js
          grep -q 'WHATSUP_DOG_SMART_REPORT_V3' whatsup-dog/community-ui-bridge.js
          grep -q 'enable row level security' supabase/migrations/20260909_whatsup_dog.sql
          grep -q "public=false" supabase/migrations/20260909_whatsup_dog.sql
          grep -q 'owner_id' supabase/migrations/20260909_whatsup_dog.sql
          if grep -Rqi 'service_role' whatsup-dog/backend-config.js; then
            echo 'backend-config.js must never contain privileged server credentials'; exit 1;
          fi
      - name: Verify mobile reporting DOM hooks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('whatsup-dog/index.html','utf8');
          const js=fs.readFileSync('whatsup-dog/smart-report-v3.js','utf8');
          for(const id of ['reportDialog','reportForm','reportTypes','reportDetails','vegetationKinds','reportFab','detailDialog']){
            if(!html.includes(`id="${id}"`)) throw new Error(`Missing DOM hook ${id}`);
          }
          for(const id of ['smartReportToolsV2','reportCameraV2','reportPhotoV2','recognizePhotoV2','geometryPointV2','geometryAreaV2','pickOnMapV2']){
            if(!js.includes(id)) throw new Error(`Missing smart hook ${id}`);
          }
          console.log('Mobile reporting flow hooks present');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Mobile browser reporting smoke test
        run: node tools/whatsup-dog-ui-smoke.mjs
      - name: Shared community backend smoke test
        run: node tools/whatsup-dog-community-smoke.mjs
